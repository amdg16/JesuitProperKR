<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예수회 고유미사</title>
  <style>
    :root {
      --font-size: 16px;
      --primary-color: #b30000;
    }
    body {
      font-family: 'KoPub Batang', 'Malgun Gothic', serif;
      font-size: var(--font-size);
      line-height: 1.6;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      color: #333;
    }
    /* 상단 도구줄 */
    #toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8f9fa;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .btn-group button {
      padding: 5px 10px;
      margin-right: 5px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 4px;
    }
    .btn-group button:hover { background: #e9ecef; }
    
    /* 미사 본문 스타일 */
    .mass-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
    .mass-date { font-size: 1.1em; color: #666; }
    .mass-title { font-size: 1.8em; font-weight: bold; color: var(--primary-color); margin: 5px 0; }
    .mass-rank { font-size: 1em; font-weight: bold; }
    
    .mass-section { margin-bottom: 25px; }
    .section-title { font-weight: bold; color: var(--primary-color); margin-bottom: 10px; font-size: 1.1em; }
    .section-content { white-space: pre-wrap; text-align: justify; }
    
    /* 하단 이동 단추 */
    #nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; border-top: 1px solid #ddd; padding-top: 20px; }
    
    /* 목록 뷰 스타일 */
    .list-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; gap: 15px; cursor: pointer; }
    .list-item:hover { background: #f9f9f9; }
    .list-date { font-weight: bold; color: var(--primary-color); min-width: 60px; }
    .list-today { background: #fff3cd; }

    /* 인쇄 시 도구줄 및 이동 단추 숨기기 */
    @media print {
      #toolbar, #nav-buttons, .list-view { display: none !important; }
      body { font-size: 12pt; max-width: 100%; padding: 0; }
      .mass-section { page-break-inside: avoid; }
    }
  </style>
</head>
<body>

  <!-- 상단 도구줄 -->
  <div id="toolbar">
    <div class="btn-group">
      <button onclick="navigate('home')">오늘/다가오는 축일</button>
      <button onclick="navigate('list')">전체 목록</button>
    </div>
    <div class="btn-group">
      <button onclick="adjustFontSize(-2)">가−</button>
      <button onclick="adjustFontSize(0)">기본</button>
      <button onclick="adjustFontSize(2)">가+</button>
    </div>
  </div>

  <!-- 메인 콘텐츠가 표시될 영역 -->
  <div id="content">데이터를 불러오는 중입니다...</div>

  <script>
    // 알려주신 구글 시트 주소가 적용된 부분입니다.
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSys6L2_-iAq7pmuS4puUKdWBpVAKk_-TycRZmxVOGHMpUyg0EyeLJzXhxUWevrtZoNETyyjzwPHk68/pub?gid=1700621661&single=true&output=csv";
    
    let massData = []; 

    // 초기화 및 글자 크기 설정
    function init() {
      const savedSize = localStorage.getItem('mass-font-size');
      if(savedSize) document.documentElement.style.setProperty('--font-size', savedSize + 'px');
      
      fetchData();
    }

    // 글자 크기 조절
    function adjustFontSize(delta) {
      if(delta === 0) {
        localStorage.removeItem('mass-font-size');
        document.documentElement.style.setProperty('--font-size', '16px');
        return;
      }
      let currentSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--font-size'));
      let newSize = currentSize + delta;
      document.documentElement.style.setProperty('--font-size', newSize + 'px');
      localStorage.setItem('mass-font-size', newSize);
    }

    // 구글 시트 CSV 불러오기 및 파싱
    async function fetchData() {
      try {
        const response = await fetch(CSV_URL);
        const csvText = await response.text();
        parseCSVToData(csvText);
        route(); 
      } catch (e) {
        document.getElementById('content').innerHTML = "데이터를 불러오는 중 오류가 발생했습니다. 링크를 확인해주세요.";
        console.error(e);
      }
    }

    function parseCSVToData(csv) {
      const rows = [];
      let row = [], inQuotes = false, curr = '';
      for (let i = 0; i < csv.length; i++) {
        const char = csv[i], next = csv[i+1];
        if (char === '"' && inQuotes && next === '"') { curr += '"'; i++; }
        else if (char === '"') { inQuotes = !inQuotes; }
        else if (char === ',' && !inQuotes) { row.push(curr.trim()); curr = ''; }
        else if (char === '\n' && !inQuotes) { row.push(curr.trim()); rows.push(row); row = []; curr = ''; }
        else if (char !== '\r') { curr += char; }
      }
      if(curr) row.push(curr.trim());
      if(row.length > 0) rows.push(row);

      const dataMap = {};
      rows.slice(1).forEach(r => {
        if(r.length < 5) return;
        let [dateRaw, title, rank, item, content] = r;
        if(!dateRaw || !content) return;
        
        // 날짜를 0731 형태로 통일
        let mmdd = dateRaw.replace(/[^0-9]/g, '');
        if(mmdd.length === 3) mmdd = '0' + mmdd;

        if(!dataMap[mmdd]) dataMap[mmdd] = { date: mmdd, title, rank, items: {} };
        dataMap[mmdd].items[item] = content;
      });
      massData = Object.values(dataMap).sort((a, b) => a.date.localeCompare(b.date));
    }

    // 화면 라우팅 (url 주소 변경 감지)
    function route() {
      const params = new URLSearchParams(window.location.search);
      const view = params.get('view');
      const date = params.get('date');

      if (view === 'list') renderList();
      else if (date) renderMass(date);
      else renderUpcomingMass();
    }

    function navigate(type, date = '') {
      const url = new URL(window.location.href);
      url.search = '';
      if(type === 'list') url.searchParams.set('view', 'list');
      if(type === 'date') url.searchParams.set('date', date);
      window.history.pushState({}, '', url);
      route();
    }

    // 전체 목록 화면
    function renderList() {
      const today = getTodayMMDD();
      let html = '<h2>전체 목록</h2><div class="list-view">';
      
      massData.forEach(d => {
        const isPast = d.date < today;
        const isToday = d.date === today;
        const bgClass = isToday ? 'list-today' : '';
        const opStyle = isPast ? 'opacity: 0.6;' : '';
        html += `<div class="list-item ${bgClass}" style="${opStyle}" onclick="navigate('date', '${d.date}')">
                   <div class="list-date">${d.date.substring(0,2)}/${d.date.substring(2,4)}</div>
                   <div>
                     <div style="font-weight:bold;">${d.title}</div>
                     <div style="font-size:0.9em; color:#666;">${d.rank}</div>
                   </div>
                 </div>`;
      });
      html += '</div>';
      document.getElementById('content').innerHTML = html;
    }

    // 다가오는/오늘 미사 
    function renderUpcomingMass() {
      const today = getTodayMMDD();
      const upcoming = massData.find(d => d.date >= today) || massData[0];
      if(upcoming) renderMass(upcoming.date);
      else document.getElementById('content').innerHTML = "표시할 데이터가 없습니다.";
    }

    // 특정 날짜 미사 화면
    function renderMass(dateStr) {
      const index = massData.findIndex(d => d.date === dateStr);
      if(index === -1) {
        document.getElementById('content').innerHTML = "해당 날짜의 미사 정보가 없습니다.";
        return;
      }
      const data = massData[index];
      
      let html = `<div class="mass-header">
                    <div class="mass-date">${data.date.substring(0,2)}월 ${data.date.substring(2,4)}일</div>
                    <div class="mass-title">${data.title}</div>
                    <div class="mass-rank">${data.rank}</div>
                  </div>`;
      
      // 구글 시트 항목(열) 순서
      const order = ['설명', '입당송', '본기도', '제1독서', '화답송', '복음 환호송', '복음', '예물 기도', '영성체송', '영성체 후 기도'];
      
      order.forEach(item => {
        if(data.items[item]) {
          html += `<div class="mass-section">
                     <div class="section-title">${item}</div>
                     <div class="section-content">${data.items[item]}</div>
                   </div>`;
        }
      });

      const prev = index > 0 ? massData[index - 1] : null;
      const next = index < massData.length - 1 ? massData[index + 1] : null;
      
      html += `<div id="nav-buttons">`;
      html += prev ? `<button onclick="navigate('date', '${prev.date}')">← 이전: ${prev.title}</button>` : `<div></div>`;
      html += next ? `<button onclick="navigate('date', '${next.date}')">다음: ${next.title} →</button>` : `<div></div>`;
      html += `</div>`;

      document.getElementById('content').innerHTML = html;
    }

    function getTodayMMDD() {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return m + day;
    }

    window.addEventListener('popstate', route);
    init();
  </script>
</body>
</html>
