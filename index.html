    // ─────────────────────────────────────────────
    // 본문 보강: 감사송·장엄 강복 펼치기, 긴 설명 접기
    // ─────────────────────────────────────────────
    function formatPlainText(text) {
      return String(text || "").split(/\n\s*\n/).map(function (para) {
        var lines = para.split("\n").map(function (l) { return l.trim(); }).filter(function (l) { return l; });
        if (!lines.length) return "";
        return "<p>" + lines.map(function (l) {
          if (l.indexOf("[[r]]") === 0) return '<span class="inline-rubric">' + escapeHtml(l.slice(5)) + "</span>";
          var h = escapeHtmlWithCross(l);
          return h.replace(/__(.+?)__/g, '<span class="bow-line">$1</span>');
        }).join("<br>") + "</p>";
      }).join("");
    }

    // "순교자 감사송" → [순교자 감사송 1, 순교자 감사송 2]
    function prefaceVariants(groupName) {
      var pre = (DATA && DATA.extra && DATA.extra.prefaces) || {};
      var out = [];
      if (pre[groupName]) out.push(pre[groupName]);
      for (var n = 1; n <= 5; n++) {
        if (pre[groupName + " " + n]) out.push(pre[groupName + " " + n]);
      }
      return out;
    }

    function expandPanelHtml(items) {
      // items: [{tab, sub, source, content}]
      var html = "";
      if (items.length > 1) {
        html += '<div class="expand-tabs ui-font" role="tablist">';
        for (var i = 0; i < items.length; i++) {
          html += '<button type="button" class="expand-tab' + (i === 0 ? " active" : "") + '" data-tab="' + i + '">' +
                  escapeHtml(items[i].tab) + "</button>";
        }
        html += "</div>";
      }
      for (var j = 0; j < items.length; j++) {
        var it = items[j];
        html += '<div class="expand-body" data-tab="' + j + '"' + (j === 0 ? "" : " hidden") + ">";
        if (it.sub || it.source) {
          html += '<div class="expand-meta ui-font">' +
            (it.sub ? escapeHtml(it.sub) : "") +
            (it.source ? '<span class="expand-source">『' + escapeHtml(it.source) + "』</span>" : "") +
            "</div>";
        }
        html += formatPlainText(it.content) + "</div>";
      }
      return html;
    }

    function makeToggle(label, key) {
      return '<button type="button" class="expand-link" data-key="' + escapeHtml(key) + '" aria-expanded="false">' +
             escapeHtml(label) + '<span class="expand-caret" aria-hidden="true">▾</span></button>';
    }

    var EXPAND_ITEMS = {};

    // 감사송 본문을 책의 짜임대로 세 문단으로: 서두(…구원의 길이옵니다.) / 본문 / 맺음(그러므로 …)
    function restructurePrefaces(root) {
      [].forEach.call(root.querySelectorAll("p"), function (p) {
        if (p.getAttribute("data-pref-done")) return;
        var t = (p.textContent || "").trim();
        if (t.indexOf("✙ 거룩하신 아버지") !== 0) return;
        // 줄(<br>) 단위로 나눠, ◎로 시작하는 줄(거룩하시도다 등)부터는 따로 떼어 둠
        var tmp = document.createElement("div");
        var parts = p.innerHTML.split(/<br\s*\/?>/i).map(function (h) { tmp.innerHTML = h; return (tmp.textContent || "").trim(); });
        var cut = parts.length;
        for (var q = 1; q < parts.length; q++) if (/^◎/.test(parts[q])) { cut = q; break; }
        var tailLines = parts.slice(cut).filter(function (x) { return x; });
        var body = parts.slice(0, cut).join(" ").replace(/^✙\s*/, "").replace(/\s+/g, " ").replace(/,(\S)/g, ", $1");
        var endIntro = body.indexOf("길이옵니다.");
        if (endIntro < 0) return;
        endIntro += "길이옵니다.".length;
        var re = /(그러므로|그리스도를 통하여 (천사들|주님 앞에서))/g, m, concl = -1;
        while ((m = re.exec(body))) if (m.index > endIntro) concl = m.index;
        var intro = body.slice(0, endIntro).trim();
        var middle = (concl > 0 ? body.slice(endIntro, concl) : body.slice(endIntro)).trim();
        var ending = concl > 0 ? body.slice(concl).trim() : "";
        var html = '<p data-pref-done="1"><span class="cross-mark">✙</span> ' + escapeHtml(intro) + "</p>";
        if (middle) html += '<p data-pref-done="1">' + escapeHtml(middle) + "</p>";
        if (ending) html += '<p data-pref-done="1">' + escapeHtml(ending) + "</p>";
        if (tailLines.length) html += '<p data-pref-done="1">' + tailLines.map(escapeHtml).join("<br>") + "</p>";
        p.insertAdjacentHTML("beforebegin", html);
        p.parentNode.removeChild(p);
      });
    }

    // 참고 줄이 폭에 넘치면 글씨를 조금씩 줄여 한 줄에 맞춤
    function fitOneLine(p) {
      var size = 0.63;
      p.style.fontSize = "";
      while (p.scrollWidth > p.clientWidth + 1 && size > 0.5) {
        size -= 0.02;
        p.style.fontSize = size.toFixed(2) + "em";
      }
    }

    function enhanceProprium(mmdd) {
      var book = document.getElementById("book");
      if (!book || !DATA) return;
      EXPAND_ITEMS = {};
      restructurePrefaces(book);
      var ps = book.querySelectorAll("p");

      for (var i = 0; i < ps.length; i++) {
        var p = ps[i];
        var text = (p.textContent || "").trim();

        // 일러두기: 눌러서 펼치기
        if (p.classList.contains("notes-line")) {
          EXPAND_ITEMS["notes"] = [{ tab: "일러두기", content: p.getAttribute("data-notes") || "" }];
          p.innerHTML = makeToggle("일러두기", "notes");
          p.insertAdjacentHTML("afterend", '<div class="expand-panel" hidden></div>');
          continue;
        }

        // "성인 고유: …(『미사 독서』…) 참조." → 본문이 바로 아래에 있으므로 숨김
        if (/^성인 고유:/.test(text)) {
          p.parentNode.removeChild(p);
          continue;
        }

        // "예수회 공통 기도문/독서: 순교자 공통 …" → 참고용 한 줄로 줄여서 공통 페이지 링크
        if (/예수회 공통 (기도문|독서)/.test(text) && DATA.extra && DATA.extra.commons) {
          var mk = text.match(/예수회 공통 (기도문|독서)/);
          var kindWord = mk[1];
          var before = text.slice(0, mk.index).trim();
          var season = (/^부활 시기 아닌 때$/.test(before) || /^부활 시기$/.test(before)) ? before : "";
          var after = text.slice(mk.index + mk[0].length).replace(/^\s*:\s*/, "");
          after = after.split(/,\s*특별히/)[0];
          var easterOnly = /,\s*부활 시기/.test(after) && !season;
          var names = after.match(/(순교자|목자|선교사|수도자) 공통/g) || [];
          if (!names.length) continue;
          var links = names.map(function (m) {
            return DATA.extra.commons[m]
              ? '<a class="common-link" data-common="' + m + '" href="?common=' + encodeURIComponent(m) + '">' + m + "</a>"
              : escapeHtml(m);
          }).join(" 또는 ");
          p.innerHTML = "예수회 공통 " + kindWord + ": " + links;
          p.setAttribute("data-ref-kind", kindWord);
          p.setAttribute("data-names", names.join("|"));
          p.className = "common-ref";
          p.removeAttribute("style");
          fitOneLine(p);
          continue;
        }

        // 그 밖의 "…, 특별히 아래의 독서들을 선택할 수 있다." → 같은 참고 한 줄로
        if (/,\s*특별히 아래의 독서들을 선택할 수 있다\.?$/.test(text)) {
          p.textContent = text.replace(/,\s*특별히 아래의 독서들을 선택할 수 있다\.?$/, "");
          p.className = "common-ref";
          p.removeAttribute("style");
          fitOneLine(p);
          continue;
        }

        // 감사송 안내: "순교자 감사송" / "목자 감사송 또는 수도자 감사송"
        if (/감사송$/.test(text) && text.length < 40 && !p.querySelector("button")) {
          var names = text.split(/\s*또는\s*/);
          var parts = [], ok = false;
          for (var k = 0; k < names.length; k++) {
            var vs = prefaceVariants(names[k]);
            if (vs.length) {
              ok = true;
              EXPAND_ITEMS["pref:" + names[k]] = vs.map(function (v) {
                return { tab: v.name, sub: v.sub, source: v.source, content: v.content };
              });
              parts.push(makeToggle(names[k], "pref:" + names[k]));
            } else {
              parts.push(escapeHtml(names[k]));
            }
          }
          if (ok) {
            p.innerHTML = parts.join(" 또는 ");
            p.classList.add("expand-line");
            p.insertAdjacentHTML("afterend", '<div class="expand-panel" hidden></div>');
          }
          continue;
        }

        // 대영광송 · 신경: 누르면 전문
        if ((text === "대영광송" || text === "신경") && DATA.extra && DATA.extra.ordinary) {
          var ord = DATA.extra.ordinary, its = [];
          if (text === "대영광송" && ord["대영광송"]) its.push({ tab: "대영광송", content: ord["대영광송"].content });
          if (text === "신경") {
            ["사도 신경", "니케아-콘스탄티노플 신경"].forEach(function (nm) {
              if (ord[nm]) its.push({ tab: nm, sub: ord[nm].sub, content: ord[nm].content });
            });
          }
          if (its.length) {
            EXPAND_ITEMS["ord:" + text] = its;
            p.innerHTML = makeToggle(text, "ord:" + text);
            p.classList.add("expand-line");
            p.insertAdjacentHTML("afterend", '<div class="expand-panel" hidden></div>');
          }
          continue;
        }

        // 장엄 강복 안내
        if (text === "장엄 강복을 할 수 있다.") {
          var bl = (DATA.extra && DATA.extra.blessings) || [];
          var items = [];
          for (var b = 0; b < bl.length; b++) if (bl[b].date && bl[b].date === mmdd) items.push({ tab: "장엄 강복", sub: bl[b].title, content: bl[b].content });
          for (var c = 0; c < bl.length; c++) if (!bl[c].date) items.push({ tab: bl[c].title || "다른 강복", sub: bl[c].title, content: bl[c].content });
          if (items.length) {
            EXPAND_ITEMS["bless"] = items;
            p.innerHTML = makeToggle("장엄 강복", "bless") + "을 할 수 있다.";
            p.classList.add("expand-line");
            p.insertAdjacentHTML("afterend", '<div class="expand-panel" hidden></div>');
          }
        }
      }

      // 공통 독서 안내가 두 번(부활 시기 / 아닌 때) 나오면 첫 번째 하나로 합치기
      var readRefs = book.querySelectorAll('p.common-ref[data-ref-kind="독서"]');
      if (readRefs.length > 1) {
        var all = [];
        var lists = [].map.call(readRefs, function (el) { return (el.getAttribute("data-names") || "").split("|"); });
        lists.sort(function (a, b) { return b.length - a.length; });
        lists.forEach(function (lst) { lst.forEach(function (n) { if (n && all.indexOf(n) < 0) all.push(n); }); });
        readRefs[0].innerHTML = "예수회 공통 독서: " + all.map(function (m) {
          return '<a class="common-link" data-common="' + m + '" href="?common=' + encodeURIComponent(m) + '">' + m + "</a>";
        }).join(" 또는 ");
        for (var rr = 1; rr < readRefs.length; rr++) readRefs[rr].parentNode.removeChild(readRefs[rr]);
        fitOneLine(readRefs[0]);
      }

      // "(부활 시기 알렐루야.)"가 적힌 곳만 → (알렐루야 부활 시기): 알렐루야는 본문 글씨, 부활 시기는 작은 지시어
      (function () {
        var w = document.createTreeWalker(book, NodeFilter.SHOW_TEXT, null), n, hits = [];
        while ((n = w.nextNode())) if (n.nodeValue.indexOf("(부활 시기 알렐루야.)") > -1) hits.push(n);
        hits.forEach(function (tn) {
          var span = document.createElement("span");
          span.innerHTML = escapeHtml(tn.nodeValue).split("(부활 시기 알렐루야.)")
            .join('<span class="easter-alleluia">(알렐루야 <span class="easter-rub">부활 시기</span>)</span>');
          tn.parentNode.replaceChild(span, tn);
        });
      })();

      // 한 독서 안에서 "부활 시기" / "부활 시기 아닌 때"로 나뉜 경우(예: 5월 24일 제1독서)
      [].forEach.call(book.querySelectorAll("p"), function (p) {
        var m = p.innerHTML.match(/^(부활 시기(?: 아닌 때)?)<br>/);
        if (!m) return;
        var msg = (m[1] === "부활 시기") ? "부활 시기에는 아래의 독서를 활용한다." : "부활 시기가 아닐 때에는 아래의 독서를 활용한다.";
        p.innerHTML = p.innerHTML.slice(m[0].length);
        p.insertAdjacentHTML("beforebegin", '<div class="season-divider ui-font">' + msg + "</div>");
      });

      // 부활 시기 / 부활 시기가 아닐 때 독서가 나뉜 날: 구분선과 작은 안내
      var h2s = [].slice.call(book.querySelectorAll("h2"));
      var isEaster = function (h) { var n = h.querySelector(".item-name"); return n && /\(\s*부활\s*시기\s*\)/.test(n.textContent); };
      var firstEaster = null, firstOther = null;
      h2s.forEach(function (h) {
        var n = h.querySelector(".item-name");
        if (!n || !/^제1독서/.test(n.textContent)) return;
        if (isEaster(h)) { if (!firstEaster) firstEaster = h; }
        else if (firstEaster && !firstOther) firstOther = h;
      });
      if (firstEaster && firstOther) {
        firstEaster.insertAdjacentHTML("beforebegin", '<div class="season-divider ui-font">부활 시기에는 아래의 독서를 활용한다.</div>');
        firstOther.insertAdjacentHTML("beforebegin", '<div class="season-divider ui-font">부활 시기가 아닐 때에는 아래의 독서를 활용한다.</div>');
        // 항목 이름의 "(부활시기)"는 구분선이 알려 주므로 떼기
        h2s.forEach(function (h) {
          var n = h.querySelector(".item-name");
          if (n) n.textContent = n.textContent.replace(/\s*\(\s*부활\s*시기\s*\)/, "");
        });
      }

      // 긴 설명 접기: 첫 문단이 짧은 요약이면 나머지는 '자세히 보기'로
      var rule = book.querySelector(".title-rule");
      var el = rule ? rule.nextElementSibling : null;
      while (el && el.tagName !== "P" && el.tagName !== "H2") el = el.nextElementSibling;
      if (el && el.tagName === "P" && !el.className) {
        var html = el.innerHTML;
        var cut = html.indexOf("<br>");
        if (cut > 0) {
          var tmp = document.createElement("div");
          tmp.innerHTML = html.slice(0, cut);
          var summary = (tmp.textContent || "").trim();
          var rest = html.slice(cut + 4);
          if (summary.length <= 130 && rest.replace(/<[^>]+>/g, "").length > 150) {
            el.innerHTML = html.slice(0, cut);
            el.classList.add("desc-summary");
            el.insertAdjacentHTML("afterend",
              '<p class="desc-more-line">' + makeToggle("자세히 보기", "desc") + "</p>" +
              '<div class="expand-panel desc-detail" hidden><p>' + rest + "</p></div>");
          }
        }
      }
    }

    document.addEventListener("click", function (e) {
      var t = e.target && e.target.closest ? e.target : null;
      if (!t) return;

      var tab = t.closest(".expand-tab");
      if (tab) {
        var panel0 = tab.closest(".expand-panel");
        var idx = tab.getAttribute("data-tab");
        panel0.querySelectorAll(".expand-tab").forEach(function (x) { x.classList.toggle("active", x === tab); });
        panel0.querySelectorAll(".expand-body").forEach(function (x) { x.hidden = x.getAttribute("data-tab") !== idx; });
        return;
      }

      var btn = t.closest(".expand-link");
      if (!btn) return;
      var line = btn.closest("p");
      var panel = line && line.nextElementSibling;
      if (!panel || !panel.classList.contains("expand-panel")) return;
      var key = btn.getAttribute("data-key");
      var wasOpen = btn.getAttribute("aria-expanded") === "true";

      line.querySelectorAll(".expand-link").forEach(function (x) { x.setAttribute("aria-expanded", "false"); });
      if (wasOpen) { panel.hidden = true; return; }

      if (key !== "desc") { panel.innerHTML = expandPanelHtml(EXPAND_ITEMS[key] || []); restructurePrefaces(panel); }
      panel.hidden = false;
      btn.setAttribute("aria-expanded", "true");
      if (key === "desc") btn.firstChild.nodeValue = "간단히 보기";
    });
    document.addEventListener("click", function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('.expand-link[data-key="desc"]') : null;
      if (btn && btn.getAttribute("aria-expanded") === "false") btn.firstChild.nodeValue = "자세히 보기";
    });


    // ─────────────────────────────────────────────
    // 통상문과 함께 보기 (?mass=MMDD): 미사 통상문 사이에 그날의 고유 부분을 끼워 넣은 페이지
    // 통상문 본문은 ordinary.json (『예수회 고유 미사』 2024 미사 통상문에서 추출)
    // ─────────────────────────────────────────────
    var ORDO = null, ORDO_LOADING = null;
    function loadOrdo() {
      if (ORDO) return Promise.resolve(ORDO);
      if (!ORDO_LOADING) {
        ORDO_LOADING = fetch("ordinary.json", { cache: "no-cache" })
          .then(function (r) { if (!r.ok) throw new Error("ordinary"); return r.json(); })
          .then(function (j) { ORDO = j; return j; });
      }
      return ORDO_LOADING;
    }

    function ordoTextHtml(t) {
      return "<p>" + String(t).split("\n").map(function (l) { return escapeHtmlWithCross(l.trim()); }).join("<br>") + "</p>";
    }

    function tabsBlockHtml(items) {
      // items: [{tab, html}]
      var h = '<div class="expand-panel always">';
      if (items.length > 1) {
        h += '<div class="expand-tabs ui-font" role="tablist">';
        items.forEach(function (it, i) {
          h += '<button type="button" class="expand-tab' + (i === 0 ? " active" : "") + '" data-tab="' + i + '">' + escapeHtml(it.tab) + "</button>";
        });
        h += "</div>";
      }
      items.forEach(function (it, i) {
        h += '<div class="expand-body" data-tab="' + i + '"' + (i === 0 ? "" : " hidden") + ">" + it.html + "</div>";
      });
      return h + "</div>";
    }

    function stripPrefaceFrame(text) {
      // 감사송 본문에서 대화(주님께서 여러분과 함께 …)와 거룩하시도다를 떼어 냄
      var paras = String(text || "").split(/\n\s*\n/);
      var out = paras.filter(function (p) {
        var t = p.trim();
        if (/^✙ (주님께서 여러분과 함께|마음을 드높이|우리 주 하느님께 감사합시다)/.test(t)) return false;
        if (/^◎ 거룩하시도다/.test(t)) return false;
        return true;
      });
      return out.join("\n\n");
    }

    function properCardHtml(r, labelOverride) {
      var parsed = parseLiturgicalContent(r.item, r.content);
      var h = '<div class="proper-slot"><div class="proper-label ui-font">' + escapeHtml(labelOverride || r.item);
      if (parsed.subtitle) h += ' <span class="subtitle">' + escapeHtml(parsed.subtitle) + "</span>";
      h += "</div>" + formatParagraphsForLiturgy(r.item, parsed.lines) + "</div>";
      return h;
    }

    function massSlotHtml(slot, rows, mmdd) {
      var ex = (DATA && DATA.extra) || {};
      var mine = rows.filter(function (r) { return r.content && baseItemName(r.item) === slot; });

      if (slot === "신경") {
        var ord = ex.ordinary || {}, its = [];
        ["사도 신경", "니케아-콘스탄티노플 신경"].forEach(function (nm) {
          if (ord[nm]) its.push({ tab: nm, html: (ord[nm].sub ? '<div class="expand-meta ui-font">' + escapeHtml(ord[nm].sub) + "</div>" : "") + formatPlainText(ord[nm].content) });
        });
        return its.length ? tabsBlockHtml(its) : "";
      }

      if (slot === "감사송") {
        if (mine.length) {
          var r0 = { item: "감사송", content: stripPrefaceFrame(mine[0].content) };
          return '<div class="proper-slot"><div class="proper-label ui-font">감사송</div>' + formatPlainText(r0.content) + "</div>";
        }
        // 예물 기도 아래에 적힌 "순교자 감사송" 등 안내에서 찾기
        var names = [];
        rows.forEach(function (r) {
          String(r.content || "").split("\n").forEach(function (l) {
            l = l.trim();
            if (/감사송$/.test(l) && l.length < 40) l.split(/\s*또는\s*/).forEach(function (n) { if (names.indexOf(n) < 0) names.push(n); });
          });
        });
        var tabs = [];
        names.forEach(function (n) {
          prefaceVariants(n).forEach(function (v) {
            tabs.push({ tab: v.name, html: '<div class="expand-meta ui-font">' + escapeHtml(v.sub || "") +
              (v.source ? '<span class="expand-source">『' + escapeHtml(v.source) + "』</span>" : "") + "</div>" + formatPlainText(stripPrefaceFrame(v.content)) });
          });
        });
        if (tabs.length) return tabsBlockHtml(tabs);
        return '<p class="mass-rubric">예식 규정에 따라 알맞은 감사송을 바친다.</p>';
      }

      if (slot === "감사 기도") {
        if (!ORDO) return "";
        var mk = function (list) { return renderOrdoList(list, null); };
        return tabsBlockHtml([{ tab: "감사 기도 제2양식", html: mk(ORDO.ep2 || []) }, { tab: "감사 기도 제3양식", html: mk(ORDO.ep3 || []) }]);
      }

      if (slot === "장엄 강복") {
        var hasBless = rows.some(function (r) { return /장엄 강복을 할 수 있다/.test(r.content || ""); });
        if (!hasBless) return "";
        var bl = ex.blessings || [], items = [];
        bl.forEach(function (b) { if (b.date && b.date === mmdd) items.push({ tab: "장엄 강복", html: '<div class="expand-meta ui-font">' + escapeHtml(b.title) + "</div>" + formatPlainText(b.content) }); });
        bl.forEach(function (b) { if (!b.date) items.push({ tab: b.title || "다른 강복", html: formatPlainText(b.content) }); });
        if (!items.length) return "";
        return '<p class="mass-rubric">오늘은 위의 강복 대신 장엄 강복을 할 수 있다.</p>' + tabsBlockHtml(items);
      }

      if (!mine.length) return "";
      // 신심 미사의 독서 묶음(독서 1, 독서 2)은 탭으로
      if (mine.length > 1 && mine.every(function (r) { return /\(독서 \d\)$/.test(r.item); })) {
        return tabsBlockHtml(mine.map(function (r) {
          var set = r.item.match(/\((독서 \d)\)$/)[1];
          return { tab: set, html: properCardHtml({ item: baseItemName(r.item), content: r.content }, slot) };
        }));
      }
      return mine.map(function (r) { return properCardHtml(r, mine.length > 1 ? r.item : slot); }).join("");
    }

    // 이어지는 기도문(주고받는 말)은 한 문단으로 묶어 줄만 바꿈
    function renderOrdoList(list, slotFn) {
      var h = "", buf = [];
      function flush() { if (buf.length) { h += ordoTextHtml(buf.join("\n")); buf = []; } }
      list.forEach(function (b) {
        if (b.k === "T") { buf.push(b.t); return; }
        flush();
        if (b.k === "SLOT") { h += slotFn ? slotFn(b) : ""; return; }
        h += ordoBlockHtml(b);
      });
      flush();
      return h;
    }

    function ordoBlockHtml(b) {
      if (b.k === "H1") return '<h2 class="mass-part ui-font">' + escapeHtml(b.t) + "</h2>";
      if (b.k === "H2") return '<h3 class="mass-sec"><span class="item-name">' + escapeHtml(b.t) + "</span></h3><hr class='item-divider'>";
      if (b.k === "R" && b.t.trim() === "또는") return '<p class="mass-or">또는</p>';
      if (b.k === "R") return '<p class="mass-rubric' + (b.foot ? " foot" : "") + '">' + escapeHtml(b.t) + "</p>";
      if (b.k === "T") return ordoTextHtml(b.t);
      return "";
    }

    function votiveBlockByNo(no) {
      var vs = (DATA.extra && DATA.extra.votives) || {};
      for (var k in vs) if (vs[k].no === String(no)) return vs[k];
      return null;
    }

    function getMassPage(mmdd) {
      if (!ORDO || !DATA) return null;
      var votive = /^v\d$/.test(String(mmdd)) ? votiveBlockByNo(String(mmdd).slice(1)) : null;
      var rows, info;
      if (votive) {
        // 신심 미사: 독서 묶음(독서 1, 독서 2)을 항목 이름에 붙여 구분
        var setName = "";
        rows = [];
        votive.rows.forEach(function (r) {
          if (r.item === "구분") { setName = r.content; return; }
          if (r.item === "일러두기" || r.item === "안내" || r.item === "큰구분") return;
          rows.push({ item: setName && /독서|화답송|복음/.test(r.item) ? r.item + "(" + setName + ")" : r.item, content: r.content });
        });
        info = { title: votive.name, color: votive.color, rank: "" };
      } else {
        rows = DATA.rows.filter(function (r) { return r.date === mmdd; });
        info = DATA.info[mmdd] || {};
      }
      if (!rows.length) return null;
      var has = function (base) { return rows.some(function (r) { return baseItemName(r.item) === base; }); };
      var cond = { gloria: has("대영광송"), creed: has("신경"), reading2: rows.some(function (r) { return r.content && baseItemName(r.item) === "제2독서"; }) };

      var rankLabel = escapeHtml(String(info.rank || "").replace(/\[/g, "(").replace(/\]/g, ")"));
      var html = '<h1 class="feast-title">' +
        (votive ? '<span class="h1-date h1-label">예수회 신심 미사</span>' : '<span class="h1-date">' + escapeHtml(formatMonthDay(mmdd)) + "</span>") +
        '<span class="h1-name">' + vestmentBadge(info.color) + escapeHtml(info.title || "") + "</span>" +
        (info.rank ? '<span class="rank-line ui-font">' + rankLabel + "</span>" : "") +
        "</h1>" +
        (votive ? votiveTabsHtml(votive.no, "mass") : modeTabsHtml(mmdd, "mass")) +
        '<div class="title-rule" aria-hidden="true"><span>✠</span></div>' +
        '<figure class="saint-figure" id="saint-figure" hidden></figure>' +
        '<div class="mass-tools ui-font"><button type="button" class="mass-rubric-toggle" id="rubric-toggle"></button></div>';

      var skip = 0;
      var list = [];
      (ORDO.main || []).forEach(function (b) {
        if (b.k === "IF") { if (skip || !cond[b.c]) skip++; return; }
        if (b.k === "ENDIF") { if (skip) skip--; return; }
        if (skip) return;
        list.push(b);
      });
      html += renderOrdoList(list, function (b) { return massSlotHtml(b.s, rows, mmdd); });
      html += '<div class="end-mark" aria-hidden="true">✠</div>';
      return { title: (votive ? votive.name : formatMonthDay(mmdd)) + " 미사 — 예수회 고유미사", body: html,
               imgKey: votive ? (VOTIVE_IMAGE[votive.no] || "") : mmdd, name: String(info.title || "").split(/\s*;\s*/)[0], votive: !!votive };
    }

    // 같은 날의 두 가지 보기: 고유 부분 | 미사 전체
    function modeTabsHtml(mmdd, active) {
      var p = (active === "proper")
        ? '<span class="mode-tab active" aria-current="page">고유 부분</span>'
        : '<a class="mode-tab" data-date="' + mmdd + '" href="?date=' + mmdd + '">고유 부분</a>';
      var m = (active === "mass")
        ? '<span class="mode-tab active" aria-current="page">미사 전체</span>'
        : '<a class="mode-tab" data-mass="' + mmdd + '" href="?mass=' + mmdd + '">미사 전체</a>';
      return '<nav class="mode-tabs ui-font" aria-label="보기 전환">' + p + m + "</nav>";
    }

    // 지시문은 페이지를 열 때마다 기본으로 켜짐(보임). 끈 상태는 그 페이지를 보는 동안만 유지
    var RUBRICS_HIDDEN = false;
    function votiveTabsHtml(no, active) {
      var p = (active === "proper")
        ? '<span class="mode-tab active" aria-current="page">고유 부분</span>'
        : '<a class="mode-tab" data-votive="' + no + '" href="?votive=' + no + '">고유 부분</a>';
      var m = (active === "mass")
        ? '<span class="mode-tab active" aria-current="page">미사 전체</span>'
        : '<a class="mode-tab" data-mass="v' + no + '" href="?mass=v' + no + '">미사 전체</a>';
      return '<nav class="mode-tabs ui-font" aria-label="보기 전환">' + p + m + "</nav>";
    }

    function rubricsHidden() { return RUBRICS_HIDDEN; }
    function applyRubricToggle() {
      var hide = rubricsHidden();
      document.documentElement.classList.toggle("hide-rubrics", hide);
      var b = document.getElementById("rubric-toggle");
      if (b) {
        b.innerHTML = '<span class="sw" aria-hidden="true"></span>지시문';
        b.setAttribute("aria-pressed", hide ? "false" : "true");
        b.title = hide ? "지시문 보이기" : "지시문 숨기기";
      }
    }
    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("#rubric-toggle") : null;
      if (!b) return;
      RUBRICS_HIDDEN = !RUBRICS_HIDDEN;
      applyRubricToggle();
    });

    // 제목 날짜 양옆의 ‹ › 버튼 (이전/다음 고유미사)
    function addDateArrows(prev, next, mode) {
      var d = document.querySelector("#book .h1-date");
      if (!d) return;
      var attr = (mode === "mass") ? "data-mass" : "data-date";
      var q = (mode === "mass") ? "?mass=" : "?date=";
      function arrow(info, dir) {
        if (!info) return '<span class="date-arrow ' + dir + ' disabled" aria-hidden="true"></span>';
        var word = (dir === "prev") ? "이전" : "다음";
        return '<a class="date-arrow ' + dir + '" ' + attr + '="' + info.date + '" href="' + q + info.date + '"' +
               ' title="' + word + ": " + escapeHtml(info.label + " " + (info.name || "")) + '"' +
               ' aria-label="' + word + ": " + escapeHtml(info.label) + '">' + (dir === "prev" ? "‹" : "›") + "</a>";
      }
      d.innerHTML = arrow(prev, "prev") + '<span class="h1-date-text">' + d.innerHTML + "</span>" + arrow(next, "next");
    }

    // 위쪽 작은 이전/다음: 날짜만
    function miniNavHtml(prev, next) {
      function link(info, dir) {
        var label = info ? info.label : "";
        var text = (dir === "prev") ? "← " + label : label + " →";
        if (!info) return '<span class="mini-link ' + dir + ' disabled"></span>';
        return '<a class="mini-link ' + dir + '" data-date="' + info.date + '" href="?date=' + info.date + '"' +
               ' title="' + escapeHtml(info.name || "") + '">' + escapeHtml(text) + "</a>";
      }
      return link(prev, "prev") + link(next, "next");
    }

    function emptyStateHtml(date, prev, next) {
      var html = '<div class="empty-state ui-font"><div class="empty-symbol">✠</div>' +
        '<div class="empty-date">' + escapeHtml(formatMonthDay(date)) + "</div>" +
        '<div class="empty-message">이 날짜에는 예정된 예수회 고유미사가 없습니다.</div>' +
        '<div class="empty-links">';
      if (next) html += '<a class="empty-link" data-date="' + next.date + '" href="?date=' + next.date + '">다음 고유미사 →</a>';
      if (prev) html += '<a class="empty-link" data-date="' + prev.date + '" href="?date=' + prev.date + '">← 이전 고유미사</a>';
      html += '<a class="empty-link" data-view="list" href="?view=list">전체 목록 보기</a>';
      return html + "</div></div>";
    }

    function listHtml() {
      var today = todayMMDD();
      var upcoming = getDefaultDate(today, DATA.dates);

      var html = '<div class="list-head">' +
        '<img class="ornament" src="' + ORNAMENT_SRC + '" alt="" width="1068" height="760" decoding="async">' +
        '<h1 class="list-title">예수회 고유미사</h1>' +
        '<div class="list-sub ui-font">' +
        '날짜를 누르시면 그날의 고유미사로 이동합니다</div>' +
        '</div>';

      var openMonth = false;
      for (var i = 0; i < DATA.dates.length; i++) {
        var date = DATA.dates[i];
        var month = Number(date.substring(0, 2));

        if (i === 0 || month !== Number(DATA.dates[i - 1].substring(0, 2))) {
          if (openMonth) html += "</div>";
          html += '<div class="month"><h2 class="month-name">' + month + "월</h2>";
          openMonth = true;
        }

        var info = DATA.info[date] || { title: "", rank: "" };
        var tag = "";
        if (date === today) tag = '<span class="tag ui-font">오늘</span>';
        else if (date === upcoming) tag = '<span class="tag ui-font">다가오는</span>';

        var parts = String(info.title).split(/\s*;\s*/).filter(function (p) { return p.length > 0; });
        var shortTitle = parts.length > 0 ? parts[0] : info.title;
        var more = (parts.length > 1)
          ? '<span class="entry-more ui-font">외 ' + (parts.length - 1) + "</span>"
          : "";

        html += '<a class="entry' + (date === today ? " is-today" : "") + (date === upcoming ? " is-upcoming" : "") +
          '" data-date="' + date + '" href="?date=' + date + '" title="' + escapeHtml(info.title) + '">' +
          '<span class="entry-date ui-font">' + escapeHtml(formatMonthDay(date)) + "</span>" +
          '<span class="entry-title">' + vestmentBadge(info.color) + escapeHtml(shortTitle) + more + tag + "</span>" +
          (info.rank ? '<span class="entry-rank ui-font">' + escapeHtml(String(info.rank).replace(/\[/g, "(").replace(/\]/g, ")")) + "</span>" : "") +
          "</a>";
      }
      if (openMonth) html += "</div>";

      var ex = DATA.extra || {};
      if (ex.commonOrder && ex.commonOrder.length) {
        html += '<div class="month extra-list"><h2 class="month-name">예수회 공통</h2>';
        ex.commonOrder.forEach(function (name) {
          html += '<a class="entry" data-common="' + escapeHtml(name) + '" href="?common=' + encodeURIComponent(name) + '">' +
            '<span class="entry-date ui-font">공통</span><span class="entry-title">' + escapeHtml(name) + " 기도문 · 독서</span></a>";
        });
        html += "</div>";
      }
      if (ex.votiveOrder && ex.votiveOrder.length) {
        html += '<div class="month extra-list"><h2 class="month-name">예수회 신심 미사</h2>';
        ex.votiveOrder.forEach(function (name) {
          var v = ex.votives[name];
          var vkey = v.no || name;
          html += '<a class="entry" data-votive="' + escapeHtml(vkey) + '" href="?votive=' + encodeURIComponent(vkey) + '">' +
            '<span class="entry-date ui-font">신심 ' + escapeHtml(v.no || "") + "</span>" +
            '<span class="entry-title">' + vestmentBadge(v.color) + escapeHtml(name) + "</span></a>";
        });
        html += "</div>";
      }

      return html;
    }

    function setNotice(text) {
      var el = document.getElementById("notice");
      if (el) el.textContent = text || "";
    }

    function setToolbar(view) {
      var home = document.querySelector(".nav-button[data-home]");
      var list = document.querySelector('.nav-button[data-view="list"]');
      if (home) {
        home.classList.toggle("home", view === "day" || view === "mass");
        // 오늘이 고유미사 날이면 버튼 이름을 '오늘의 고유미사'로
        var isTodayProper = !!(DATA && DATA.info && DATA.info[todayMMDD()]);
        home.textContent = isTodayProper ? "오늘의 고유미사" : "다가오는 고유미사";
      }
      if (list) list.classList.toggle("active", view === "list");
    }

    function stateToUrl(state, home) {
      if (home) return window.location.pathname;
      if (state.view === "list") return "?view=list";
      if (state.view === "common") return "?common=" + encodeURIComponent(state.key);
      if (state.view === "mass") return "?mass=" + state.date;
      if (state.view === "votive") return "?votive=" + encodeURIComponent(state.key);
      return "?date=" + state.date;
    }

    function render(state, opts) {
      opts = opts || {};
      currentState = state;

      var navHtml = "";
      var miniHtml = "";
      var title = "예수회 고유미사";

      document.documentElement.classList.toggle("votive-view", state.view === "votive");
      if (state.view === "list") {
        document.getElementById("book").innerHTML = listHtml();
        title = "전체 목록 — 예수회 고유미사";
      } else if (state.view === "mass") {
        if (opts.push || opts.scroll) RUBRICS_HIDDEN = false;
        var mp = ORDO ? getMassPage(state.date) : null;
        if (mp) {
          document.getElementById("book").innerHTML = mp.body;
          title = mp.title;
          applyRubricToggle();
          enhanceProprium(mp.votive ? null : state.date);
          state.imgKey = mp.imgKey || "";
          document.documentElement.classList.toggle("votive-view", !!mp.votive);
          if (!mp.votive) {
            // 날짜 양옆 ‹ › : 이전·다음 날의 '미사 전체'로
            var pd = getPrevDate(state.date, DATA.dates), nd = getNextDate(state.date, DATA.dates);
            addDateArrows(pd && pd !== state.date ? buildNavInfo(pd) : null, nd && nd !== state.date ? buildNavInfo(nd) : null, "mass");
          }
          if (mp.imgKey) showSaintImage(mp.imgKey, mp.name);
        } else {
          document.getElementById("book").innerHTML = '<div class="status ui-font">미사 통상문을 불러오는 중…</div>';
          loadOrdo().then(function () {
            if (currentState && currentState.view === "mass") render(currentState, {});
          }).catch(function () {
            document.getElementById("book").innerHTML = '<div class="status ui-font">미사 통상문(ordinary.json)을 불러오지 못했습니다.</div>';
          });
        }
      } else if (state.view === "common" || state.view === "votive") {
        var sp = getSpecialPage(state);
        document.getElementById("book").innerHTML = sp ? sp.body :
          '<div class="status ui-font">해당 내용을 찾지 못했습니다. <a data-view="list" href="?view=list">전체 목록</a></div>';
        if (sp) {
          title = sp.title;
          state.imgKey = sp.imgKey || "";
          enhanceProprium(null);
          if (sp.imgKey) showSaintImage(sp.imgKey, sp.name);
        }
      } else {
        var prevDate = getPrevDate(state.date, DATA.dates);
        var nextDate = getNextDate(state.date, DATA.dates);
        if (prevDate === state.date) prevDate = null;
        if (nextDate === state.date) nextDate = null;
        var prev = buildNavInfo(prevDate);
        var next = buildNavInfo(nextDate);

        var proprium = getProprium(state.date);
        document.getElementById("book").innerHTML =
          proprium ? proprium.body : emptyStateHtml(state.date, prev, next);
        navHtml = navCardHtml(prev, "prev") + navCardHtml(next, "next");
        if (proprium) {
          title = proprium.title;
          addDateArrows(prev, next);
          enhanceProprium(currentState && currentState.date);
          var saintName = String((DATA.info[state.date] || {}).title || "").split(/\s*;\s*/)[0];
          showSaintImage(state.date, saintName);
        }
      }

      document.getElementById("nav-bottom").innerHTML = navHtml;
      document.title = title;
      setToolbar(state.view === "mass" && /^v\d$/.test(String(state.date)) ? "votive" : state.view);

      if (opts.push) {
        try {
          window.history.pushState(state, "", stateToUrl(state, opts.home));
        } catch (e) {}
      }
      if (opts.scroll) {
        if (state.view === "list" && !opts.top) scrollToUpcomingMonth();
        else window.scrollTo(0, 0);
      }
    }

    // 전체 목록을 열면 오늘/다가오는 고유미사가 있는 달부터 보이게 (위로 올리면 앞 달도 그대로 있음)
    function scrollToUpcomingMonth() {
      var entry = document.querySelector("#book .entry.is-today, #book .entry.is-upcoming");
      var month = entry && entry.closest ? entry.closest(".month") : null;
      if (!month) { window.scrollTo(0, 0); return; }
      var y = month.getBoundingClientRect().top + (window.pageYOffset || 0) - 12;
      window.scrollTo(0, Math.max(0, y));
    }

    function defaultState() {
      return { view: "day", date: getDefaultDate(todayMMDD(), DATA.dates) };
    }

    function initialState() {
      var params = null;
      try { params = new URLSearchParams(window.location.search); } catch (e) {}
      if (params && params.get("view") === "list") return { view: "list" };
      if (params && params.get("common")) return { view: "common", key: params.get("common") };
      if (params && params.get("mass")) { var mq = params.get("mass"); return { view: "mass", date: /^v\d$/.test(mq) ? mq : (normalizeDate(mq) || mq) }; }
      if (params && params.get("votive")) return { view: "votive", key: params.get("votive") };

      var q = params ? (params.get("date") || "") : "";
      return isValidMMDD(q) ? { view: "day", date: q } : defaultState();
    }

    document.addEventListener("click", function (e) {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target.closest ? e.target.closest("a[data-date], a[data-home], a[data-view], a[data-common], a[data-votive], a[data-mass]") : null;
      if (!a || !DATA) return;

      e.preventDefault();
      if (a.hasAttribute("data-home")) {
        render(defaultState(), { push: true, home: true, scroll: true });
      } else if (a.hasAttribute("data-mass")) {
        render({ view: "mass", date: a.getAttribute("data-mass") }, { push: true, scroll: true });
      } else if (a.hasAttribute("data-common")) {
        render({ view: "common", key: a.getAttribute("data-common") }, { push: true, scroll: true });
      } else if (a.hasAttribute("data-votive")) {
        render({ view: "votive", key: a.getAttribute("data-votive") }, { push: true, scroll: true });
      } else if (a.hasAttribute("data-view")) {
        render({ view: a.getAttribute("data-view") }, { push: true, scroll: true, top: a.hasAttribute("data-top") });
      } else {
        render({ view: "day", date: a.getAttribute("data-date") }, { push: true, scroll: true });
      }
    });

    window.addEventListener("popstate", function () {
      if (DATA) render(initialState(), { scroll: true });
    });

    function showStatus(html) {
      document.getElementById("book").innerHTML = '<div class="status ui-font">' + html + "</div>";
      document.getElementById("nav-bottom").innerHTML = "";
    }

    function showError(msg) {
      showStatus(msg + '<br><button type="button" class="retry" id="retry">다시 시도</button>');
      var b = document.getElementById("retry");
      if (b) b.addEventListener("click", function () { window.location.reload(); });
    }

    function readCache() {
      try { return window.localStorage.getItem(CACHE_KEY); } catch (e) { return null; }
    }
    function writeCache(text) {
      try { window.localStorage.setItem(CACHE_KEY, text); } catch (e) {}
    }

    function readAsCsv(res) {
      if (!res.ok) throw new Error("http " + res.status);
      return res.text().then(function (text) {
        if (/^\s*<(!doctype|html)/i.test(text)) throw new Error("not csv");
        return text;
      });
    }

    function fetchCsv() {
      return fetch(DATA_URL, { cache: "no-store" })
        .then(readAsCsv)
        .catch(function (err) {
          if (typeof CSV_URL !== "string" || CSV_URL.indexOf("http") !== 0) throw err;
          return fetch(CSV_URL, { cache: "no-store" }).then(readAsCsv);
        });
    }

    function start(csvText, isRefresh) {
      var data = buildData(csvText);
      if (data.rows.length === 0) throw new Error("empty");
      DATA = data;
      var st = (isRefresh && currentState) ? currentState : initialState();
      render(st, (!isRefresh && st.view === "list") ? { scroll: true } : {});
    }

    function load() {
      var cached = readCache();
      var showedCache = false;
      if (cached) {
        try { start(cached, false); showedCache = true; } catch (e) {}
      }

      fetchCsv()
        .then(function (text) {
          setNotice("");
          if (text === cached && showedCache) return;
          start(text, showedCache);
          writeCache(text);
        })
        .catch(function () {
          if (showedCache) {
            setNotice("자료를 새로 불러오지 못해, 이 기기에 저장해 둔 내용을 보여 드리고 있습니다.");
          } else {
            showError("내용을 불러오지 못했습니다.<br>인터넷 연결을 확인하고 다시 시도해 주세요.");
          }
        });
    }

    load();
  })();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
  </script>
</body>
</html>
