<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예수회 고유미사</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-size: 16px;
      --primary-color: #a71930; /* 예수회 붉은색 */
      --bg-color: #fdfbf7; /* 종이 미색 */
      --line-color: #d8c8b8; /* 은은한 구분선 색상 */
    }
    body {
      font-family: 'Nanum Myeongjo', 'KoPub Batang', serif;
      font-size: var(--font-size);
      line-height: 1.8;
      background-color: #e9e5de; /* 바깥 회색 배경 */
      margin: 0;
      padding: 20px;
      color: #222;
    }
    #app-container {
      max-width: 700px;
      margin: 0 auto;
      background-color: var(--bg-color);
      padding: 40px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      border-radius: 4px;
    }
    
    /* 상단 도구줄 */
    #toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--line-color);
    }
    .btn-group button {
      font-family: 'Nanum Myeongjo', serif;
      padding: 6px 12px;
      margin-right: 5px;
      cursor: pointer;
      border: 1px solid #ddd;
      background: #fafafa;
      border-radius: 4px;
      font-size: 14px;
    }
    .btn-group button:hover { background: #eee; }
    
    /* 미사 본문 제목 스타일 */
    .mass-header { text-align: center; margin-bottom: 30px; border-bottom: 3px double var(--primary-color); padding-bottom: 20px; }
    .mass-date { font-size: 1.1em; color: #555; margin-bottom: 5px; }
    .mass-title { font-size: 2em; font-weight: bold; color: var(--primary-color); margin: 0; line-height: 1.3; }
    .mass-rank { font-size: 1em; font-weight: bold; margin-top: 10px; color: #444; }
    
    /* 삽화 이미지 */
    .mass-art { text-align: center; margin-bottom: 30px; }
    .mass-art img { max-width: 100%; height: auto; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    
    /* 본문 섹션 및 구분선 */
    .mass-section { margin-bottom: 30px; padding-bottom: 30px; border-bottom: 1px dashed var(--line-color); }
    .mass-section:last-child { border-bottom: none; padding-bottom: 0; }
    .section-title { font-weight: bold; color: var(--primary-color); margin-bottom: 12px; font-size: 1.15em; text-align: center; }
    .section-content { white-space: pre-wrap; text-align: justify; word-break: keep-all; }
    
    /* 이전/다음 이동 버튼 (상단, 하단 공통) */
    .nav-buttons { display: flex; justify-content: space-between; gap: 15px; margin: 30px 0; }
    .nav-buttons button { 
      font-family: 'Nanum Myeongjo', serif; 
      padding: 12px; 
      background: #fff; 
      border: 1px solid var(--line-color); 
      border-radius: 6px; 
      cursor: pointer; 
      flex: 1; 
      font-size: 1em;
      transition: background 0.2s;
    }
    .nav-buttons button:hover { background: #f2efe9; }
    .nav-btn-text { color: #555; font-size: 0.9em; margin-bottom: 4px; display: block; }
    .nav-btn-title { display: block; font-size: 0.95em; font-weight: bold; color: var(--primary-color); line-height: 1.4; }
    
    /* 목록 뷰 스타일 */
    .list-item { padding: 15px; border-bottom: 1px solid var(--line-color); display: flex; gap: 20px; cursor: pointer; align-items: center; }
    .list-item:hover { background: #f5f4e8; }
    .list-date { font-weight: bold; color: var(--primary-color); min-width: 60px; font-size: 1.1em; }
    .list-today { background: #fff9e6; border-left: 4px solid var(--primary-color); padding-left: 11px; }

    /* 인쇄 모드 */
    @media print {
      body { background-color: #fff; padding: 0; }
      #app-container { box-shadow: none; padding: 0; max-width: 100%; border: none; }
      #toolbar, .nav-buttons, .list-view { display: none !important; }
      .mass-section { page-break-inside: avoid; border-bottom: 1px solid #ddd; }
    }
  </style>
</head>
<body>
<div id="app-container">
  <!-- 상단 도구줄 -->
  <div id="toolbar">
    <div class="btn-group">
      <button onclick="navigate('home')">오늘/다가오는 축일</button>
      <button onclick="navigate('list')">전체 목록</button>
    </div>
    <div class="btn-group">
      <button onclick="adjustFontSize(-2)">가−</button>
      <button onclick="adjustFontSize(0)">기본</button>
      <button onclick="adjustFontSize(2)">가+</button>
    </div>
  </div>

  <!-- 메인 콘텐츠가 표시될 영역 -->
  <div id="content">데이터를 불러오는 중입니다...</div>
</div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSys6L2_-iAq7pmuS4puUKdWBpVAKk_-TycRZmxVOGHMpUyg0EyeLJzXhxUWevrtZoNETyyjzwPHk68/pub?gid=1700621661&single=true&output=csv";
    let massData = []; 

    function init() {
      const savedSize = localStorage.getItem('mass-font-size');
      if(savedSize) document.documentElement.style.setProperty('--font-size', savedSize + 'px');
      fetchData();
    }

    function adjustFontSize(delta) {
      if(delta === 0) {
        localStorage.removeItem('mass-font-size');
        document.documentElement.style.setProperty('--font-size', '16px');
        return;
      }
      let currentSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--font-size'));
      let newSize = currentSize + delta;
      document.documentElement.style.setProperty('--font-size', newSize + 'px');
      localStorage.setItem('mass-font-size', newSize);
    }

    async function fetchData() {
      try {
        const response = await fetch(CSV_URL);
        const csvText = await response.text();
        parseCSVToData(csvText);
        route(); 
      } catch (e) {
        document.getElementById('content').innerHTML = "데이터를 불러오는 중 오류가 발생했습니다.";
      }
    }

    function parseCSVToData(text) {
      let p = '', row = [''], rows = [row], i = 0, r = 0, s = !0, l;
      for (l of text) {
          if ('"' === l) {
              if (s && l === p) row[i] += l;
              s = !s;
          } else if (',' === l && s) l = row[++i] = '';
          else if ('\n' === l && s) {
              if ('\r' === p) row[i] = row[i].slice(0, -1);
              row = rows[++r] = [l = '']; i = 0;
          } else row[i] += l;
          p = l;
      }

      const dataMap = {};
      rows.slice(1).forEach(r => {
        if(r.length < 5) return;
        let [dateRaw, title, rank, item, content] = r;
        if(!dateRaw || !content || content.trim() === '') return;
        
        let mmdd = dateRaw.replace(/[^0-9]/g, '');
        if(mmdd.length === 3) mmdd = '0' + mmdd;
        if(mmdd.length !== 4) return;

        if(!dataMap[mmdd]) dataMap[mmdd] = { date: mmdd, title, rank, items: {} };
        dataMap[mmdd].items[item.trim()] = content.trim();
      });
      massData = Object.values(dataMap).sort((a, b) => a.date.localeCompare(b.date));
    }

    function route() {
      const params = new URLSearchParams(window.location.search);
      const view = params.get('view');
      const date = params.get('date');

      if (view === 'list') renderList();
      else if (date) renderMass(date);
      else renderUpcomingMass();
    }

    function navigate(type, date = '') {
      const url = new URL(window.location.href);
      url.search = '';
      if(type === 'list') url.searchParams.set('view', 'list');
      if(type === 'date') url.searchParams.set('date', date);
      window.history.pushState({}, '', url);
      route();
    }

    function renderList() {
      const today = getTodayMMDD();
      let html = '<h2 style="color:var(--primary-color); border-bottom:2px solid; padding-bottom:10px;">전체 목록</h2><div class="list-view">';
      
      massData.forEach(d => {
        const isPast = d.date < today;
        const isToday = d.date === today;
        const bgClass = isToday ? 'list-today' : '';
        const opStyle = isPast ? 'opacity: 0.5;' : '';
        html += `<div class="list-item ${bgClass}" style="${opStyle}" onclick="navigate('date', '${d.date}')">
                   <div class="list-date">${parseInt(d.date.substring(0,2))}월 ${parseInt(d.date.substring(2,4))}일</div>
                   <div>
                     <div style="font-weight:bold; font-size:1.1em;">${d.title}</div>
                     <div style="font-size:0.9em; color:#777;">${d.rank}</div>
                   </div>
                 </div>`;
      });
      html += '</div>';
      document.getElementById('content').innerHTML = html;
    }

    function renderUpcomingMass() {
      const today = getTodayMMDD();
      const upcoming = massData.find(d => d.date >= today) || massData[0];
      if(upcoming) renderMass(upcoming.date);
      else document.getElementById('content').innerHTML = "표시할 데이터가 없습니다.";
    }

    function createNavHtml(prev, next) {
      let html = `<div class="nav-buttons">`;
      if (prev) {
        let pDate = `${parseInt(prev.date.substring(0,2))}월 ${parseInt(prev.date.substring(2,4))}일`;
        html += `<button onclick="navigate('date', '${prev.date}')">
                   <span class="nav-btn-text">← 이전</span>
                   <span class="nav-btn-title">${pDate}<br>(${prev.title})</span>
                 </button>`;
      } else {
        html += `<div style="flex:1"></div>`;
      }
      if (next) {
        let nDate = `${parseInt(next.date.substring(0,2))}월 ${parseInt(next.date.substring(2,4))}일`;
        html += `<button onclick="navigate('date', '${next.date}')">
                   <span class="nav-btn-text">다음 →</span>
                   <span class="nav-btn-title">${nDate}<br>(${next.title})</span>
                 </button>`;
      } else {
        html += `<div style="flex:1"></div>`;
      }
      html += `</div>`;
      return html;
    }

    function renderMass(dateStr) {
      const index = massData.findIndex(d => d.date === dateStr);
      if(index === -1) return;
      const data = massData[index];
      
      const prev = index > 0 ? massData[index - 1] : null;
      const next = index < massData.length - 1 ? massData[index + 1] : null;

      let html = '';
      
      // 1. 최상단 이전/다음 버튼
      html += createNavHtml(prev, next);

      // 2. 미사 헤더
      html += `<div class="mass-header">
                 <div class="mass-date">${parseInt(data.date.substring(0,2))}월 ${parseInt(data.date.substring(2,4))}일</div>
                 <h1 class="mass-title">${data.title}</h1>
                 <div class="mass-rank">${data.rank}</div>
               </div>`;
      
      // 3. 삽화 이미지 (./img/0731.webp)
      html += `<div class="mass-art">
                 <img src="./img/${data.date}.webp" onerror="this.style.display='none'" alt="${data.title} 삽화">
               </div>`;

      // 4. 구글 시트 항목들
      const order = ['설명', '입당송', '본기도', '제1독서', '제2독서', '화답송', '부속가', '복음 환호송', '복음', '예물 기도', '영성체송', '영성체 후 기도'];
      
      order.forEach(item => {
        if(data.items[item]) {
          html += `<div class="mass-section">
                     <div class="section-title">${item}</div>
                     <div class="section-content">${data.items[item]}</div>
                   </div>`;
        }
      });

      // 5. 최하단 이전/다음 버튼
      html += createNavHtml(prev, next);

      document.getElementById('content').innerHTML = html;
      window.scrollTo(0, 0); 
    }

    function getTodayMMDD() {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return m + day;
    }

    window.addEventListener('popstate', route);
    init();
  </script>
</body>
</html>
