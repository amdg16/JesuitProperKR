<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예수회 고유미사</title>
  <meta name="description" content="예수회 고유미사. 그날 미사의 고유 부분 — 입당송, 본기도, 독서와 복음, 예물기도, 영성체송, 영성체 후 기도 — 을 읽기 좋게 보여 드립니다.">
  <meta name="theme-color" content="#f8f5ed">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-title" content="예수회 고유미사">
  <meta property="og:type" content="website">
  <meta property="og:title" content="예수회 고유미사">
  <meta property="og:description" content="예수회 고유 전례력에 따른 전례문을 볼 수 있습니다.">
  <meta property="og:image" content="img/frontispiece.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/ihs-emblem.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#a71930">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="예수회 고유미사">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

  <script>
    var DATA_URL = "/api/propers";
    var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSys6L2_-iAq7pmuS4puUKdWBpVAKk_-TycRZmxVOGHMpUyg0EyeLJzXhxUWevrtZoNETyyjzwPHk68/pub?gid=1700621661&single=true&output=csv";
    // 긴 축일 이름 처리: "shrink" = 이름이 길면 날짜·이름을 함께 조금 작게
    //                    "split"  = 세미콜론(;)마다 줄을 나누고 둘째 줄부터 작게
    var TITLE_MODE = "shrink";
    var TIMEZONE = "Asia/Seoul";
    var NAV_SHOW_RANK = false;

    // ── 축일별 성인 이미지 ─────────────────────────────────────────────
    // img/saints 폴더에 날짜(MMDD) 이름으로 그림을 올리면 그날 페이지에 자동으로 나옵니다.
    //   예) img/saints/0731.jpg  → 7월 31일 성 이냐시오
    // .jpg를 먼저 찾고, 없으면 .jpeg → .png → .webp 순서로 찾습니다. 없으면 그림 없이 본문만 나옵니다.
    // 그림 아래에 설명·출처를 달고 싶으면 아래에 적으세요 (선택).
    var SAINT_IMAGE_DIR = "img/saints/";
    var SAINT_IMAGE_EXTS = ["jpg", "jpeg", "png", "webp"];
    var SAINT_CAPTIONS = {
      // "0731": "페테르 파울 루벤스, 〈성 이냐시오 데 로욜라〉",
    };
  </script>

  <style>
    :root {
      --paper: #f8f5ed;
      --paper-dark: #eee9dc;
      --ink: #292722;
      --muted: #777269;
      --accent: #6e2e32;
      --accent-light: #8a5558;
      --line: #d8d0c2;
      --rubric: #8b4d4d;
      --white: #fffdf8;
      --base: 16px;
    }

    @media (max-width: 600px) {
      :root { --base: 17px; }
    }

    * { box-sizing: border-box; }

    html {
      margin: 0;
      padding: 0;
      background: var(--paper);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      color: var(--ink);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 20px 60px;
    }

    .ui-font {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .nav-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: rgba(255,255,255,0.45);
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      letter-spacing: -0.2px;
      transition: background 0.15s, color 0.15s;
    }

    .nav-button:hover { background: var(--white); color: var(--accent); }

    .nav-button.home {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
      font-weight: 600;
    }

    .size-control { display: inline-flex; align-items: center; gap: 6px; }

    .size-btn {
      font-family: inherit;
      min-width: 46px;
      min-height: 40px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: rgba(255,255,255,0.45);
      color: var(--accent);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .size-btn.reset { min-width: 0; padding: 0 12px; font-size: 13px; font-weight: normal; color: var(--muted); }
    .size-btn:hover:not(:disabled) { background: var(--white); }
    .size-btn:disabled { opacity: 0.35; cursor: default; }

    .navigation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .navigation.bottom { margin-top: 22px; margin-bottom: 0; }
    .navigation:empty { display: none; }

    .nav-card {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-height: 68px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,0.45);
      color: var(--ink);
      text-decoration: none;
      line-height: 1.45;
      transition: background 0.15s;
    }

    .nav-card:hover { background: var(--white); }
    .nav-card.next { align-items: flex-end; text-align: right; }
    .nav-card.disabled { opacity: 0.35; pointer-events: none; }

    .nav-dir  { color: var(--muted); font-size: 12px; }
    .nav-date { color: var(--accent); font-size: 15px; font-weight: 600; }
    .nav-name { color: var(--muted); font-size: 13px; word-break: keep-all; }

    .book {
      position: relative;
      background: rgba(255,253,248,0.88);
      border: 1px solid var(--line);
      box-shadow: 0 1px 3px rgba(50,40,25,0.05);
      border-radius: 3px;
      padding: 42px 48px 55px;
      font-size: var(--base);
    }


    h1 {
      margin: 0 0 1.1em;
      padding-bottom: 0.7em;
      border-bottom: 1px solid var(--line);
      color: var(--accent);
      font-size: 1.5em;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -0.5px;
      text-align: center;
      word-break: keep-all;
    }

    h2 {
      margin: 1.9em 0 0.45em;
      padding-top: 2px;
      color: var(--ink);
      font-size: 1.1em;
      font-weight: 600;
      line-height: 1.5;
    }

    h2:first-of-type { margin-top: 1.3em; }

    .item-name { color: var(--accent); }
    .subtitle { margin-left: 6px; color: var(--muted); font-size: 0.78em; font-weight: normal; }

    hr.item-divider {
      height: 1px;
      margin: 0 0 0.95em;
      border: 0;
      background: var(--line);
    }

    p {
      margin: 0 0 0.9em;
      color: var(--ink);
      font-size: 1em;
      line-height: 1.65;
      letter-spacing: -0.15px;
      word-break: keep-all;
      text-align: left;
    }

    p.antiphon-body { margin-top: 1.1em; }

    p.verse {
      margin: 0 0 0.3em;
      font-size: 1em;
      line-height: 1.55;
      text-align: left;
    }

    .cross-mark { color: var(--rubric); }

    p.rubric {
      margin: 1.1em 0;
      color: var(--rubric);
      font-size: 1.02em;
      font-weight: 600;
      line-height: 1.7;
      text-align: left;
    }

    p.reading-outro { margin-top: 0; font-weight: normal; }

    .empty-state, .status {
      padding: 65px 20px;
      text-align: center;
    }

    .status { color: var(--muted); font-size: 0.85em; line-height: 1.7; }
    .status .retry {
      margin-top: 14px;
      padding: 10px 18px;
      border: 1px solid var(--accent);
      border-radius: 5px;
      background: var(--accent);
      color: white;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .empty-symbol  { margin-bottom: 0.6em; color: var(--accent); font-size: 1.6em; }
    .empty-date    { margin-bottom: 0.5em; color: var(--ink); font-size: 1.25em; font-weight: 600; }
    .empty-message { margin-bottom: 1.6em; color: var(--muted); font-size: 0.85em; }

    .empty-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 300px;
      margin: 0 auto;
    }

    .empty-link {
      display: block;
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--white);
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
    }

    .footer {
      margin-top: 25px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      .page { padding: 12px 10px 40px; }
      .book { padding: 28px 18px 40px; }
      p { text-align: left; }
      .navigation { gap: 8px; }
      .nav-card { padding: 8px 10px; }
      .nav-name { font-size: 12.5px; }
    }

    @media (max-width: 380px) {
      .page { padding-left: 7px; padding-right: 7px; }
      .book { padding-left: 15px; padding-right: 15px; }
      .nav-button { padding: 6px 9px; font-size: 13px; }
    }

    .toolbar { flex-wrap: wrap; }
    .toolbar-group { display: inline-flex; gap: 8px; }

    .nav-button.active {
      border-color: var(--accent);
      background: var(--white);
      color: var(--accent);
      font-weight: 600;
    }

    .notice {
      margin-bottom: 12px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent-light);
      border-radius: 4px;
      background: rgba(255,255,255,0.55);
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.65;
    }

    .notice:empty { display: none; }

    .ornament {
      display: block;
      width: 100%;
      max-width: 560px;
      height: auto;
      margin: -14px auto 2px;
      mix-blend-mode: multiply;
      opacity: 0.9;
    }

    .list-head { margin-bottom: 1.6em; text-align: center; }

    .list-title {
      margin: 0;
      padding-bottom: 0;
      border-bottom: 0;
      color: var(--accent);
      font-size: 1.45em;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .list-sub { margin-top: 0.7em; color: var(--muted); font-size: 0.72em; line-height: 1.7; }

    .month { margin-top: 1.9em; }
    .month:first-of-type { margin-top: 0.4em; }

    .month .month-name {
      margin: 0 0 0.35em;
      padding: 0 0 0.35em;
      border-bottom: 1px solid var(--line);
      color: var(--accent);
      font-size: 0.92em;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .entry {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 0.6em 0.45em;
      border-bottom: 1px dotted var(--line);
      color: var(--ink);
      text-decoration: none;
      line-height: 1.6;
    }

    .entry:last-child { border-bottom: 0; }
    .entry:hover { background: var(--white); }
    .entry.is-today { background: rgba(110,46,50,0.055); }

    .entry-date {
      flex: 0 0 5.4em;
      color: var(--accent);
      font-size: 0.82em;
      font-variant-numeric: tabular-nums;
    }

    .entry-title { flex: 1 1 auto; font-size: 0.93em; word-break: keep-all; }
    .entry-rank { flex: 0 0 auto; color: var(--muted); font-size: 0.72em; white-space: nowrap; }
    .entry-more { margin-left: 7px; color: var(--muted); font-size: 0.8em; white-space: nowrap; }

    .entry .tag {
      display: inline-block;
      margin-left: 7px;
      padding: 1px 6px;
      border: 1px solid var(--accent-light);
      border-radius: 3px;
      color: var(--accent-light);
      font-size: 0.66em;
      font-weight: 600;
      white-space: nowrap;
      vertical-align: 0.15em;
    }

    /* 성인 이미지 */
    .saint-figure {
      margin: -0.3em auto 1.6em;
      text-align: center;
    }
    .saint-figure[hidden] { display: none; }

    .saint-figure img {
      display: block;
      max-width: 100%;
      max-height: 440px;
      width: auto;
      height: auto;
      margin: 0 auto;
      padding: 6px;
      border: 1px solid var(--line);
      background: var(--white);
      box-shadow: 0 1px 6px rgba(50,40,25,0.08);
    }

    .saint-figure figcaption {
      margin-top: 0.55em;
      color: var(--muted);
      font-size: 0.68em;
      line-height: 1.5;
    }
    .saint-figure figcaption a { color: inherit; }

    @media (max-width: 600px) {
      .saint-figure img { max-height: 340px; padding: 4px; }
    }

    .footer-mark {
      display: block;
      width: 36px;
      height: auto;
      margin: 0 auto 9px;
      mix-blend-mode: multiply;
      opacity: 0.6;
    }

    @media (max-width: 600px) {
      .toolbar-group { flex: 1 1 100%; }
      .toolbar-group .nav-button { flex: 1 1 0; }
      .size-control { margin: 0 auto; }
      .entry { gap: 8px; flex-wrap: wrap; }
      .entry-date { flex: 0 0 4.9em; }
      .entry-rank { flex: 0 0 auto; }
    }

    @media print {
      :root { --base: 11.5pt; }

      html, body { background: #fff; }
      body { background-image: none; color: #000; }

      .toolbar, .navigation, .notice { display: none !important; }
      .page { max-width: none; padding: 0; }

      .book {
        border: 0;
        padding: 0;
        background: none;
        box-shadow: none;
      }

      .book::before, .book::after { display: none; }

      h1, .item-name, .entry-date, .list-title { color: #000; }
      p.rubric { color: #333; }
      a { color: inherit; text-decoration: none; }

      h2, hr.item-divider { break-after: avoid; page-break-after: avoid; }
      p { break-inside: avoid; page-break-inside: avoid; orphans: 2; widows: 2; }

      .ornament, .footer-mark { filter: grayscale(1); }
      .saint-figure { break-inside: avoid; page-break-inside: avoid; }
      .saint-figure img { max-height: 300px; box-shadow: none; }
      .footer { margin-top: 20px; color: #555; opacity: 1; }
    }

    /* ── 제목: 날짜 / 이름 두 줄 ── */
    h1.feast-title {
      margin: 0;
      padding: 0;
      border-bottom: 0;
      font-size: 1.4em;
      line-height: 1.45;
      text-align: center;
    }
    h1 .h1-date { display: block; color: var(--accent); }
    h1 .h1-name { display: block; color: var(--ink); }
    h1 .tag { font-size: 0.5em; vertical-align: 0.3em; }

    .title-rule {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0.9em 0 1.5em;
      color: var(--accent-light);
      font-size: 0.8em;
    }
    .title-rule::before, .title-rule::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .vestment { white-space: nowrap; }
    .vest-white  { color: #aaa396; }   /* 백: 옅은 회색 */
    .vest-red    { color: #c0161f; }
    .vest-violet { color: #6b2d8f; }
    .vest-green  { color: #2e7d32; }

    sup.vnum {
      margin-right: 1px;
      color: var(--muted);
      font-size: 0.62em;
      line-height: 0;
      vertical-align: 0.55em;
    }

    /* ── 상단 한 줄 ── */
    .toolbar { flex-wrap: nowrap; margin-bottom: 14px; }
    .toolbar-group {
      display: inline-flex;
      gap: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(255,255,255,0.45);
    }
    .toolbar-group .nav-button {
      min-height: 36px;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .toolbar-group .nav-button + .nav-button { border-left: 1px solid var(--line); }
    .toolbar-group .nav-button.home,
    .toolbar-group .nav-button.active { background: var(--accent); color: #fff; font-weight: 600; }
    .toolbar-group .nav-button.home:not(.active):not(.current) {}
    .size-btn { min-height: 36px; min-width: 42px; }

    @media (max-width: 600px) {
      .toolbar-group { flex: 0 1 auto; }
      .toolbar-group .nav-button { flex: 0 0 auto; padding: 6px 11px; font-size: 13px; }
      .size-control { margin: 0; gap: 4px; }
      .size-btn { min-width: 36px; padding: 0 7px; font-size: 14px; }
      .size-btn.reset { padding: 0 8px; font-size: 12px; }
      h1.feast-title { font-size: 1.3em; }
    }

    @media print {
      h1 .h1-date, h1 .h1-name { color: #000; }
    }

    /* ── 긴 제목 ── */
    h1.feast-title.is-long { font-size: 1.15em; }
    h1 .h1-sub {
      display: block;
      margin-top: 0.35em;
      color: var(--muted);
      font-size: 0.68em;
      font-weight: 500;
      line-height: 1.5;
    }
    @media (max-width: 600px) {
      h1.feast-title.is-long { font-size: 1.1em; }
    }

    /* ── 전례서 마무리 ── */
    .end-mark {
      margin: 2.6em 0 0;
      color: var(--accent-light);
      font-size: 0.95em;
      text-align: center;
      opacity: 0.8;
    }
    .footer { margin-top: 34px; font-size: 10.5px; letter-spacing: 0.05em; opacity: 0.85; }
    .footer-mark { width: 52px; margin-bottom: 10px; opacity: 0.85; }

    /* 목록: 오늘·다가오는 행 강조 */
    .entry.is-today, .entry.is-upcoming {
      margin: 2px 0;
      border-bottom-color: transparent;
      border-radius: 4px;
      background: rgba(110,46,50,0.08);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .entry.is-today .entry-title, .entry.is-upcoming .entry-title { font-weight: 600; }

    /* 위쪽 작은 이전/다음 */
    .mini-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: -4px 2px 8px;
      font-size: 13px;
    }
    .mini-nav:empty { display: none; }
    .mini-link {
      padding: 4px 2px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .mini-link:hover { text-decoration: none; }
    .mini-link.disabled { visibility: hidden; }
    @media print { .mini-nav { display: none !important; } }

    /* 위쪽 이전/다음: 글자 크기 버튼과 같은 테두리 버튼 */
    .mini-nav { margin: 0 0 10px; }
    .mini-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,0.45);
      font-size: 13px;
    }
    .mini-link:hover { background: var(--white); }

    /* 그림 크게 보기 */
    .saint-figure img.zoomable { cursor: zoom-in; }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
      background: rgba(22,18,14,0.94);
      cursor: zoom-out;
    }
    .lightbox[hidden] { display: none; }
    .lightbox img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }
    .lightbox-close {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 10px);

  <script>
    (function () {
      var STEPS = [10, 11, 12, 13, 14, 15, 16, 18, 19, 21, 23, 25, 28, 32];
      var KEY = "proprium-font-step";

      function defaultIdx() { return (window.innerWidth <= 600) ? 7 : 6; }
      function valid(n) { return typeof n === "number" && n >= 0 && n < STEPS.length && n === Math.floor(n); }
      function stored() {
        try {
          var s = window.localStorage.getItem(KEY);
          if (s !== null) { var n = parseInt(s, 10); if (valid(n)) return n; }
        } catch (e) {}
        return null;
      }
      function save(n) { try { window.localStorage.setItem(KEY, String(n)); } catch (e) {} }
      function clearSaved() { try { window.localStorage.removeItem(KEY); } catch (e) {} }

      var idx = stored();
      if (idx === null) idx = defaultIdx();

      function apply() { document.documentElement.style.setProperty("--base", STEPS[idx] + "px"); }
      apply();

      function refreshButtons() {
        var down = document.getElementById("fs-down");
        var up = document.getElementById("fs-up");
        if (down) down.disabled = (idx <= 0);
        if (up) up.disabled = (idx >= STEPS.length - 1);
      }

      function set(n) {
        if (!valid(n)) return;
        idx = n; apply(); save(idx); refreshButtons();
      }

      document.addEventListener("DOMContentLoaded", function () {
        var down = document.getElementById("fs-down");
        var up = document.getElementById("fs-up");
        var reset = document.getElementById("fs-reset");
        if (down) down.addEventListener("click", function () { set(idx - 1); });
        if (up) up.addEventListener("click", function () { set(idx + 1); });
        if (reset) reset.addEventListener("click", function () {
          idx = defaultIdx(); apply(); clearSaved(); refreshButtons();
        });
        refreshButtons();
      });
    })();
  </script>

    function parseCSV(text) {
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      var rows = [], row = [], field = "", inQuotes = false;

      for (var i = 0; i < text.length; i++) {
        var c = text.charAt(i);
        if (inQuotes) {
          if (c === '"') {
            if (text.charAt(i + 1) === '"') { field += '"'; i++; }
            else { inQuotes = false; }
          } else {
            field += c;
          }
        } else {
          if (c === '"') { inQuotes = true; }
          else if (c === ",") { row.push(field); field = ""; }
          else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
          else if (c === "\r") { /* 무시 */ }
          else { field += c; }
        }
      }
      if (field !== "" || row.length > 0) { row.push(field); rows.push(row); }
      return rows;
    }

    function normalizeDate(v) {
      var s = String(v == null ? "" : v).trim();
      if (!s) return "";
      var m, mm, dd;

      if ((m = s.match(/^\d{4}[-.\/\s]+(\d{1,2})[-.\/\s]+(\d{1,2})\D*$/))) {
        mm = Number(m[1]); dd = Number(m[2]);
      } else if ((m = s.match(/^(\d{1,2})[-.\/\s]+(\d{1,2})[-.\/\s]+\d{4}$/))) {
        mm = Number(m[1]); dd = Number(m[2]);
      } else if ((m = s.match(/^(\d{1,2})\D+(\d{1,2})\D*$/))) {
        mm = Number(m[1]); dd = Number(m[2]);
      } else if (/^\d{3,4}$/.test(s)) {
        s = ("0000" + s).slice(-4);
        mm = Number(s.substring(0, 2)); dd = Number(s.substring(2, 4));
      } else {
        return "";
      }

      if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return "";
      return (mm < 10 ? "0" : "") + mm + (dd < 10 ? "0" : "") + dd;
    }

    function buildData(csvText) {
      var table = parseCSV(csvText);
      table.shift();

      var rows = [];
      var extra = { prefaces: {}, blessings: [], commons: {}, commonOrder: [], votives: {}, votiveOrder: [], ordinary: {} };
      for (var i = 0; i < table.length; i++) {
        var r = table[i];
        var kind = String(r[0] || "").trim();
        // 날짜 칸이 '감사송' / '장엄강복'인 행: 날짜별 미사가 아닌 공통 본문
        if (kind === "감사송") {
          extra.prefaces[String(r[3] || "").trim()] = {
            name: String(r[3] || "").trim(), sub: String(r[1] || "").trim(),
            source: String(r[2] || "").trim(), content: String(r[4] || "").trim()
          };
          continue;
        }
        if (kind === "통상문") {
          extra.ordinary[String(r[3] || "").trim()] = {
            name: String(r[3] || "").trim(), sub: String(r[1] || "").trim(), content: String(r[4] || "").trim()
          };
          continue;
        }
        if (kind === "장엄강복") {
          var bd = String(r[2] || "").trim();
          if (/^\d{3}$/.test(bd)) bd = "0" + bd;
          extra.blessings.push({
            title: String(r[1] || "").trim(), date: bd,
            name: String(r[3] || "").trim(), content: String(r[4] || "").trim()
          });
          continue;
        }
        // 날짜 칸이 '공통' / '신심미사'인 행: 예수회 공통 기도문·독서, 신심 미사
        if (kind === "공통" || kind === "신심미사") {
          var bname = String(r[1] || "").trim();
          var store = (kind === "공통") ? extra.commons : extra.votives;
          var order = (kind === "공통") ? extra.commonOrder : extra.votiveOrder;
          if (!store[bname]) {
            store[bname] = { name: bname, no: String(r[2] || "").trim(), color: String(r[5] || "").trim(), rows: [] };
            order.push(bname);
          }
          store[bname].rows.push({ item: String(r[3] || "").trim(), content: String(r[4] || "").trim() });
          continue;
        }
        var date = normalizeDate(r[0]);
        if (!date) continue;
        rows.push({
          date: date,
          title: String(r[1] || "").trim(),
          rank: String(r[2] || "").trim(),
          item: String(r[3] || "").trim(),
          content: String(r[4] || "").trim(),
          color: String(r[5] || "").trim()
        });
      }

      var set = {}, info = {};
      for (var j = 0; j < rows.length; j++) {
        var x = rows[j];
        set[x.date] = true;
        if (!info[x.date]) info[x.date] = { title: "", rank: "", color: "" };
        if (!info[x.date].title && x.title) info[x.date].title = x.title;
        if (!info[x.date].rank && x.rank) info[x.date].rank = x.rank;
        if (!info[x.date].color && x.color) info[x.date].color = x.color;
      }

      return { rows: rows, dates: Object.keys(set).sort(), info: info, extra: extra };
    }

    function todayMMDD() {
      var parts = new Intl.DateTimeFormat("en-US", {
        timeZone: TIMEZONE, month: "2-digit", day: "2-digit"
      }).formatToParts(new Date());
      var m = "", d = "";
      for (var i = 0; i < parts.length; i++) {
        if (parts[i].type === "month") m = parts[i].value;
        if (parts[i].type === "day") d = parts[i].value;
      }
      return m + d;
    }

    function isValidMMDD(s) {
      if (!s || !/^\d{4}$/.test(s)) return false;
      var m = Number(s.substring(0, 2)), d = Number(s.substring(2, 4));
      return m >= 1 && m <= 12 && d >= 1 && d <= 31;
    }

    function formatMonthDay(mmdd) {
      return Number(mmdd.substring(0, 2)) + "월 " + Number(mmdd.substring(2, 4)) + "일";
    }

    function getDefaultDate(today, dates) {
      if (dates.length === 0) return today;
      for (var i = 0; i < dates.length; i++) {
        if (dates[i] >= today) return dates[i];
      }
      return dates[0];
    }

    function getPrevDate(target, dates) {
      if (dates.length === 0) return null;
      for (var i = dates.length - 1; i >= 0; i--) {
        if (dates[i] < target) return dates[i];
      }
      return dates[dates.length - 1];
    }

    function getNextDate(target, dates) {
      if (dates.length === 0) return null;
      for (var i = 0; i < dates.length; i++) {
        if (dates[i] > target) return dates[i];
      }
      return dates[0];
    }

    function buildNavInfo(mmdd) {
      if (!mmdd) return null;
      var info = DATA.info[mmdd] || { title: "", rank: "" };
      var name = info.title;
      if (NAV_SHOW_RANK && info.rank) name += " " + info.rank;
      return { date: mmdd, label: formatMonthDay(mmdd), name: name };
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // 줄 맨 앞의 ✙(감사송 등에서 쓰는 십자가) 기호를 빨간색으로 고정
    function escapeHtmlWithCross(text) {
      return escapeHtml(text).replace(/^(✙|✠)/, '<span class="cross-mark">$1</span>');
    }

    function firstNonEmpty(rows, key) {
      for (var i = 0; i < rows.length; i++) {
        if (rows[i][key]) return rows[i][key];
      }
      return "";
    }

    // 영대 색 표시: 시트 F열(색)의 백·홍·자·녹
    var VESTMENT_CLASS = { "백": "vest-white", "홍": "vest-red", "자": "vest-violet", "녹": "vest-green" };

    function vestmentBadge(color) {
      var c = String(color || "").replace(/[\[\]\s]/g, "");
      if (!VESTMENT_CLASS[c]) return "";
      return '<span class="vestment ' + VESTMENT_CLASS[c] + '">[' + c + ']</span> ';
    }

    // 독서·복음 본문 속 절 번호를 작은 위첨자로
    function markVerseNumbers(html) {
      return html.replace(/(^|\s)(\d{1,3}[ㄱ-ㅎ]?)(?=\s)/g, '$1<sup class="vnum">$2</sup>');
    }

    // 제목 이름 부분. 이름이 길면 날짜·이름을 함께 조금 작게(is-long)
    var LONG_TITLE_CHARS = 38;
    function buildNameHtml(rawTitle, rank, color) {
      var rankText = rank ? "(" + rank + ")" : "";
      var parts = String(rawTitle || "").split(/\s*;\s*/).filter(function (x) { return x; });
      if (TITLE_MODE === "split" && parts.length > 1) {
        var subs = "";
        for (var i = 1; i < parts.length; i++) {
          subs += '<span class="h1-sub">' + escapeHtml(parts[i]) + "</span>";
        }
        return {
          html: '<span class="h1-name">' + vestmentBadge(color) + escapeHtml(parts[0] + rankText) + "</span>" + subs,
          long: (parts[0] + rankText).length > LONG_TITLE_CHARS
        };
      }
      var full = String(rawTitle || "") + rankText;
      return {
        html: '<span class="h1-name">' + vestmentBadge(color) + escapeHtml(full) + "</span>",
        long: full.length > LONG_TITLE_CHARS
      };
    }

    function buildDisplayTitle(mmdd, rawTitle, rank) {
      var title = formatMonthDay(mmdd) + ": " + rawTitle;
      if (rank) title += "(" + rank + ")";
      return title;
    }

    function splitLines(text) {
      return String(text).split(/\n+/).map(function (l) { return l.trim(); })
        .filter(function (l) { return l.length > 0; });
    }

    function baseItemName(itemName) {
      return String(itemName || "").replace(/\s*[（(].*?[)）]\s*$/, "").trim();
    }

    function parseLiturgicalContent(itemName, text) {
      var baseName = baseItemName(itemName);
      var lines = splitLines(text);
      var subtitle = "";

      if (baseName === "입당송" || baseName === "영성체송") {
        var refMatch = lines.length > 0
          ? lines[0].match(/^([^\s]+ \d+[0-9a-zA-Z가-힣,.\-()]*\s*(?:참조)?)\s+(.*)/)
          : null;
        var refOnly = lines.length > 1 && /^[^\s]+ \d+[0-9a-zA-Z가-힣,.\-()]*(?:\s+참조)?\s*$/.test(lines[0]);
        if (refOnly) {
          subtitle = lines[0];
          lines.shift();
        } else if (refMatch) {
          subtitle = refMatch[1].trim();
          lines[0] = refMatch[2].trim();
        } else if (lines.length > 1 && lines[0].length < 35 && /[0-9]/.test(lines[0])) {
          subtitle = lines[0];
          lines.shift();
        }
      }

      else if (baseName === "제1독서" || baseName === "제2독서" || baseName === "복음") {
        var match = lines.length > 0 ? lines[0].match(/^[<〈](.*?)[>〉](.*)/) : null;
        if (match) {
          subtitle = "〈" + match[1].trim() + "〉";
          if (match[2].trim()) lines[0] = match[2].trim();
          else lines.shift();
        } else if (lines.length > 0 && /^[<〈].*[>〉]$/.test(lines[0])) {
          subtitle = lines[0];
          lines.shift();
        }
      }

      else if (baseName === "화답송" || baseName === "복음 환호송") {
        if (lines.length > 0 && lines[0].charAt(0) !== "◎" && lines[0].charAt(0) !== "○") {
          subtitle = lines[0];
          lines.shift();
        }
      }

      lines = lines.map(function (l) { return l.replace(/(말씀입니다\.)\s*[0-9]+\s*$/, "$1"); });
      lines = lines.filter(function (l) { return !/^[0-9]+$/.test(l); });

      return { subtitle: subtitle, lines: lines };
    }

    function formatParagraphsForLiturgy(itemName, lines) {
      var html = "";
      var buffer = [];
      var baseName = baseItemName(itemName);
      var isVerseSection = (baseName === "화답송" || baseName === "복음 환호송");
      var isReading = (baseName === "제1독서" || baseName === "제2독서" || baseName === "복음");
      var isAntiphon = (itemName === "입당송" || itemName === "영성체송");
      var isFirstBlock = true;
      var nextBlockStyle = "";

      function flush() {
        if (buffer.length === 0) return;
        var cls = (isFirstBlock && isAntiphon) ? ' class="antiphon-body"' : "";
        var stl = nextBlockStyle ? ' style="' + nextBlockStyle + '"' : "";
        var body = buffer.map(escapeHtmlWithCross).join("<br>");
        if (isReading) body = markVerseNumbers(body);
        html += "<p" + cls + stl + ">" + body + "</p>";
        buffer = [];
        isFirstBlock = false;
        nextBlockStyle = "";
      }

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];

        var isRubricLike = (
          /예수회 공통|공통:|성인 고유:|감사송:/.test(line) ||
          (line.indexOf("감사송") > -1 && line.length < 40) ||
          (line.indexOf("공통") > -1 && line.length < 40) ||
          (line.indexOf("참조.") !== -1 && line.length < 40)
        );

        if (isRubricLike) {
          flush();
          nextBlockStyle = "";
          html += '<p class="rubric" style="margin-top: 1.8em;">' + escapeHtml(line) + "</p>";
          isFirstBlock = false;
          continue;
        }

        if (isVerseSection) {
          flush();
          html += '<p class="verse">' + escapeHtmlWithCross(line) + "</p>";
          isFirstBlock = false;
          continue;
        }

        if (
          (line.indexOf("말씀입니다.") > -1 && line.indexOf("주님의 말씀입니다.") === -1) ||
          line.charAt(0) === "✠" ||
          line.charAt(0) === "▥"
        ) {
          flush();
          var mt = nextBlockStyle ? nextBlockStyle + " " : "";
          nextBlockStyle = "";
          var introLine = line;
          if (
            (baseName === "제1독서" || baseName === "제2독서") &&
            introLine.charAt(0) !== "▥" &&
            introLine.charAt(0) !== "✠"
          ) {
            introLine = "▥ " + introLine;
          }
          html += '<p style="' + mt + 'margin-bottom:0.1em;">' + escapeHtml(introLine) + "</p>";
          isFirstBlock = false;
          continue;
        }

        if (line.indexOf("주님의 말씀입니다.") === 0) {
          flush();
          html += '<p class="reading-outro">' + escapeHtml(line) + "</p>";
          isFirstBlock = false;
          continue;
        }

        if (
          /비나이다\.$/.test(line) ||
          /다스리시나이다\.$/.test(line) ||
          /다름없나이다\.$/.test(line) ||
          /옳은 일입니다\.$/.test(line)
        ) {
          buffer.push(line);
          flush();
          nextBlockStyle = "margin-top: 1.8em;";
          continue;
        }

        buffer.push(line);
      }

      flush();
      return html;
    }

    function getProprium(mmdd) {
      var rows = DATA.rows.filter(function (r) { return r.date === mmdd; });
      if (rows.length === 0) return null;

      var rawTitle = firstNonEmpty(rows, "title");
      var rank = firstNonEmpty(rows, "rank");
      var color = firstNonEmpty(rows, "color");
      var displayTitle = buildDisplayTitle(mmdd, rawTitle, rank);
      var rankLabel = escapeHtml(String(rank || "").replace(/\[/g, "(").replace(/\]/g, ")"));
      var nameParts = buildNameHtml(rawTitle, "", color);
      var html = '<h1 class="feast-title' + (nameParts.long ? " is-long" : "") + '">' +
        '<span class="h1-date">' + escapeHtml(formatMonthDay(mmdd)) +
          (mmdd === todayMMDD() ? ' <span class="tag ui-font">오늘</span>' : "") +
        "</span>" +
        nameParts.html +
        (rank ? '<span class="rank-line ui-font">' + rankLabel + "</span>" : "") +
        "</h1>" +
        modeTabsHtml(mmdd, "proper") +
        '<div class="title-rule" aria-hidden="true"><span>✠</span></div>';

      html += '<figure class="saint-figure" id="saint-figure" hidden></figure>';

      var descRow = null;
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].item === "설명") { descRow = rows[i]; break; }
      }
      if (descRow && descRow.content) {
        html += formatParagraphsForLiturgy("설명", splitLines(descRow.content));
      }

      html += renderItemRows(rows);

      html += '<div class="end-mark" aria-hidden="true">✠</div>';
      return { title: displayTitle, body: html };
    }

    // 입당송·본기도·독서 등 항목들을 차례로 그리기 (고유미사·공통·신심 미사 공용)
    function renderItemRows(rows) {
      var html = "";
      rows.filter(function (r) {
        if (r.item === "설명") return false;
        if (r.content) return true;
        var base = baseItemName(r.item);
        return (base === "대영광송" || base === "신경");
      }).forEach(function (r) {
        if (r.item === "큰구분") { html += '<h2 class="part-heading ui-font">' + escapeHtml(r.content) + "</h2>"; return; }
        if (r.item === "구분") { html += '<h3 class="set-heading ui-font">' + escapeHtml(r.content) + "</h3>"; return; }
        if (r.item === "안내") { html += '<p class="rubric">' + escapeHtml(r.content) + "</p>"; return; }
        if (r.item === "일러두기") {
          html += '<p class="notes-line ui-font" data-notes="' + escapeHtml(r.content) + '">일러두기</p>';
          return;
        }
        if (!r.content) {
          html += "<p class='rubric'>" + escapeHtml(r.item) + "</p>";
          return;
        }
        var parsed = parseLiturgicalContent(r.item, r.content);
        var titleHtml = "<h2><span class='item-name'>" + escapeHtml(r.item) + "</span>";
        if (parsed.subtitle) {
          var subClass = "subtitle";
          titleHtml += " <span class='" + subClass + "'>" + escapeHtml(parsed.subtitle) + "</span>";
        }
        titleHtml += "</h2>";
        html += titleHtml + "<hr class='item-divider'>" + formatParagraphsForLiturgy(r.item, parsed.lines);
      });
      return html;
    }

    // 신심 미사 그림: 해당 성인 축일 그림을 그대로 씀 (1 이냐시오 7/31, 2 하비에르 12/3, 3 알로이시오 6/21)
    var VOTIVE_IMAGE = { "1": "0731", "2": "1203", "3": "0621" };

    // 예수회 공통(순교자·목자·선교사·수도자) / 신심 미사 페이지
    function getSpecialPage(state) {
      var ex = DATA.extra || {};
      var block = null, label = "";
      if (state.view === "common") { block = (ex.commons || {})[state.key]; label = "예수회 공통"; }
      else {
        label = "예수회 신심 미사";
        var vs = ex.votives || {};
        block = vs[state.key] || null;
        if (!block) for (var k in vs) if (vs[k].no === String(state.key)) { block = vs[k]; break; }
      }
      if (!block) return null;
      var html = '<h1 class="feast-title">' +
        '<span class="h1-date h1-label">' + escapeHtml(label) + "</span>" +
        '<span class="h1-name">' + vestmentBadge(block.color) + escapeHtml(block.name) + "</span>" +
        "</h1>" +
        (state.view === "votive" && block.no ? votiveTabsHtml(block.no, "proper") : "") +
        '<div class="title-rule" aria-hidden="true"><span>✠</span></div>';
      var imgKey = (state.view === "votive") ? (VOTIVE_IMAGE[block.no] || "") : "";
      if (imgKey) html += '<figure class="saint-figure" id="saint-figure" hidden></figure>';
      html += renderItemRows(block.rows);
      html += '<div class="end-mark" aria-hidden="true">✠</div>';
      return { title: block.name + " — 예수회 고유미사", body: html, imgKey: imgKey, name: block.name };
    }

    function specialKeyFromName(view, name) { return name; }

    // ── 성인 이미지 불러오기 ──────────────────────────────────────────
    // img/saints/MMDD.jpg → .png → .webp 순서로 시도, 모두 없으면 조용히 넘어간다
    function showSaintImage(mmdd, altText) {
      var exts = (typeof SAINT_IMAGE_EXTS === "object" && SAINT_IMAGE_EXTS) ? SAINT_IMAGE_EXTS : ["jpg"];
      var dir = (typeof SAINT_IMAGE_DIR === "string") ? SAINT_IMAGE_DIR : "img/saints/";
      var captions = (typeof SAINT_CAPTIONS === "object" && SAINT_CAPTIONS) ? SAINT_CAPTIONS : {};

      function attempt(i) {
        if (i >= exts.length) return;
        var img = new Image();
        img.alt = altText || "";
        img.decoding = "async";
        img.onload = function () {
          var fig = document.getElementById("saint-figure");
          if (!fig || !currentState || (currentState.imgKey || currentState.date) !== mmdd) return; // 그사이 다른 페이지로 넘어감
          fig.innerHTML = "";
          img.className = "zoomable";
          img.title = "눌러서 크게 보기";
          img.addEventListener("click", function () { openLightbox(img.src, img.alt); });
          fig.appendChild(img);
          if (captions[mmdd]) {
            var fc = document.createElement("figcaption");
            fc.className = "ui-font";
            fc.textContent = captions[mmdd];
            fig.appendChild(fc);
          }
          fig.hidden = false;
        };
        img.onerror = function () { attempt(i + 1); };
        img.src = dir + mmdd + "." + exts[i];
      }
      attempt(0);
    }

    // 그림 크게 보기: 누르면 화면 가득 그림만, 아무 데나 누르거나 Esc로 닫기
    function openLightbox(src, alt) {
      var box = document.getElementById("lightbox");
      var big = document.getElementById("lightbox-img");
      if (!box || !big) return;
      big.src = src;
      big.alt = alt || "";
      box.hidden = false;
      document.documentElement.classList.add("lightbox-open");
    }
    function closeLightbox() {
      var box = document.getElementById("lightbox");
      if (!box || box.hidden) return;
      box.hidden = true;
      document.documentElement.classList.remove("lightbox-open");
    }
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeLightbox();
    });

    // 모바일 스와이프: 날짜 페이지에서 좌우로 밀어 이전/다음 고유미사로
    //  - 손가락을 왼쪽으로 밀면(책장 넘기듯) 다음 날, 오른쪽으로 밀면 이전 날
    //  - 화면 가장자리(안드로이드 '뒤로 가기' 제스처 영역)에서 시작한 동작은 무시
    (function () {
      var book = document.getElementById("book");
      var sx = 0, sy = 0, st = 0, active = false, dx = 0, locked = null;
      var EDGE = 28, MIN = 70, MAXTIME = 700;

      function arrowFor(dir) { return document.querySelector("#book .date-arrow." + dir + ":not(.disabled)"); }
      function reset() {
        book.style.transition = "transform 0.18s ease, opacity 0.18s ease";
        book.style.transform = ""; book.style.opacity = "";
      }

      document.addEventListener("touchstart", function (e) {
        active = false; locked = null; dx = 0;
        if (!currentState || !(currentState.view === "day" || (currentState.view === "mass" && !/^v\d$/.test(String(currentState.date))))) return;
        if (e.touches.length !== 1 || document.documentElement.classList.contains("lightbox-open")) return;
        var t = e.touches[0], w = window.innerWidth;
        if (t.clientX < EDGE || t.clientX > w - EDGE) return;
        if (e.target.closest && e.target.closest("input, textarea, .expand-tabs, pre, table")) return;
        sx = t.clientX; sy = t.clientY; st = Date.now(); active = true;
        book.style.transition = "none";
      }, { passive: true });

      document.addEventListener("touchmove", function (e) {
        if (!active) return;
        var t = e.touches[0], mx = t.clientX - sx, my = t.clientY - sy;
        if (locked === null && (Math.abs(mx) > 10 || Math.abs(my) > 10)) {
          locked = Math.abs(mx) > Math.abs(my) * 1.5 ? "x" : "y";
        }
        if (locked !== "x") return;
        dx = mx;
        var damp = Math.max(-60, Math.min(60, dx * 0.35));
        book.style.transform = "translateX(" + damp + "px)";
        book.style.opacity = String(1 - Math.min(0.25, Math.abs(damp) / 240));
      }, { passive: true });

      document.addEventListener("touchend", function () {
        if (!active) return;
        active = false;
        var quick = (Date.now() - st) < MAXTIME;
        var sel = window.getSelection && String(window.getSelection());
        if (locked === "x" && Math.abs(dx) >= MIN && quick && !sel) {
          var a = arrowFor(dx < 0 ? "next" : "prev");
          if (a) {
            book.style.transition = "transform 0.12s ease, opacity 0.12s ease";
            book.style.transform = "translateX(" + (dx < 0 ? -40 : 40) + "px)";
            book.style.opacity = "0.4";
            setTimeout(function () { book.style.transition = "none"; book.style.transform = ""; book.style.opacity = ""; a.click(); }, 120);
            return;
          }
        }
        reset();
      }, { passive: true });

      document.addEventListener("touchcancel", function () { active = false; reset(); }, { passive: true });
    })();

    // 맨 위로 버튼: 어느 정도 내려가면 오른쪽 아래에 나타남
    (function () {
      var btn = document.getElementById("to-top");
      if (!btn) return;
      var ticking = false;
      function update() {
        btn.classList.toggle("show", (window.pageYOffset || 0) > 700);
        ticking = false;
      }
      window.addEventListener("scroll", function () {
        if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
      }, { passive: true });
      btn.addEventListener("click", function () {
        try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) { window.scrollTo(0, 0); }
      });
      update();
    })();
    document.addEventListener("click", function (e) {

    var ORNAMENT_SRC = "img/frontispiece.png";

    function navCardHtml(info, dir) {
      var cls = "nav-card " + dir;
      var dirLabel = (dir === "prev") ? "← 이전" : "다음 →";
      if (!info) {
        return '<span class="' + cls + ' disabled"><span class="nav-dir">' + dirLabel +
               '</span><span class="nav-date">없음</span></span>';
      }
