  <style>
    /* ======================================================
       기본
       ====================================================== */
    :root {
      --paper: #f8f5ed;
      --paper-dark: #eee9dc;
      --ink: #292722;
      --muted: #777269;
      --accent: #6e2e32;
      --accent-light: #8a5558;
      --line: #d8d0c2;
      --rubric: #8b4d4d;
      --white: #fffdf8;

      /* 본문 기본 글자 크기 (JS가 글자 크기 단계에 맞춰 바꿈) */

       상단 도구줄

      align-items: center;

    @media print {

  <!-- ======================================================
       글자 크기 (먼저 실행해서 처음부터 원하는 크기로 그림)
       ====================================================== -->
  <script>
    (function () {
      var STEPS = [13, 14, 15, 16, 18, 19, 21, 23, 25, 28, 32];   // 글자 크기 단계(px)
      var KEY = "proprium-font-step";

      function defaultIdx() { return (window.innerWidth <= 600) ? 5 : 4; } // 모바일 19px, PC 18px
      function valid(n) { return typeof n === "number" && n >= 0 && n < STEPS.length && n === Math.floor(n); }
      function stored() {
        try {
          var s = window.localStorage.getItem(KEY);
          if (s !== null) { var n = parseInt(s, 10); if (valid(n)) return n; }
        } catch (e) {}
        return null;
      }
      function save(n) { try { window.localStorage.setItem(KEY, String(n)); } catch (e) {} }
      function clearSaved() { try { window.localStorage.removeItem(KEY); } catch (e) {} }

      var idx = stored();
      if (idx === null) idx = defaultIdx();

      function apply() { document.documentElement.style.setProperty("--base", STEPS[idx] + "px"); }
      apply();

      function refreshButtons() {
        var down = document.getElementById("fs-down");
        var up = document.getElementById("fs-up");
        if (down) down.disabled = (idx <= 0);
        if (up) up.disabled = (idx >= STEPS.length - 1);
      }

      function set(n) {
        if (!valid(n)) return;
        idx = n; apply(); save(idx); refreshButtons();
      }

      document.addEventListener("DOMContentLoaded", function () {
        var down = document.getElementById("fs-down");
        var up = document.getElementById("fs-up");
        var reset = document.getElementById("fs-reset");
        if (down) down.addEventListener("click", function () { set(idx - 1); });
        if (up) up.addEventListener("click", function () { set(idx + 1); });
        if (reset) reset.addEventListener("click", function () {
          idx = defaultIdx(); apply(); clearSaved(); refreshButtons();
        });
        refreshButtons();
      });
    })();
  </script>
</head>

  <script>
  (function () {
    "use strict";

    var CACHE_KEY = "proprium-csv-cache";
    var DATA = null;           // { rows, dates, info }
    var currentState = null;   // 지금 보고 있는 화면 { view: "day" | "list", date: "MMdd" }

    /* ==========================================================
       CSV 읽기 (따옴표 안의 줄바꿈·쉼표 처리)
       ========================================================== */
    function parseCSV(text) {
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      var rows = [], row = [], field = "", inQuotes = false;

      for (var i = 0; i < text.length; i++) {
        var c = text.charAt(i);
        if (inQuotes) {
          if (c === '"') {
            if (text.charAt(i + 1) === '"') { field += '"'; i++; }
            else { inQuotes = false; }
          } else {
            field += c;
          }
        } else {
          if (c === '"') { inQuotes = true; }
          else if (c === ",") { row.push(field); field = ""; }
          else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
          else if (c === "\r") { /* 무시 */ }
          else { field += c; }
        }
      }
      if (field !== "" || row.length > 0) { row.push(field); rows.push(row); }
      return rows;
    }

    /* 시트의 날짜 칸을 "MMdd"로 통일: 0917 / 917 / 9/17 / 9월 17일 / 2026-09-17 / 9/17/2026 */
    function normalizeDate(v) {
      var s = String(v == null ? "" : v).trim();
      if (!s) return "";
      var m, mm, dd;

      if ((m = s.match(/^\d{4}[-.\/\s]+(\d{1,2})[-.\/\s]+(\d{1,2})\D*$/))) {
        mm = Number(m[1]); dd = Number(m[2]);
      } else if ((m = s.match(/^(\d{1,2})[-.\/\s]+(\d{1,2})[-.\/\s]+\d{4}$/))) {
        mm = Number(m[1]); dd = Number(m[2]);
      } else if ((m = s.match(/^(\d{1,2})\D+(\d{1,2})\D*$/))) {
        mm = Number(m[1]); dd = Number(m[2]);
      } else if (/^\d{3,4}$/.test(s)) {
        s = ("0000" + s).slice(-4);
        mm = Number(s.substring(0, 2)); dd = Number(s.substring(2, 4));
      } else {
        return "";
      }

      if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return "";
      return (mm < 10 ? "0" : "") + mm + (dd < 10 ? "0" : "") + dd;
    }

    function buildData(csvText) {
      var table = parseCSV(csvText);
      table.shift(); // 첫 행은 제목

      var rows = [];
      for (var i = 0; i < table.length; i++) {
        var r = table[i];
        var date = normalizeDate(r[0]);
        if (!date) continue;
        rows.push({
          date: date,
          title: String(r[1] || "").trim(),
          rank: String(r[2] || "").trim(),
          item: String(r[3] || "").trim(),
          content: String(r[4] || "").trim()
        });
      }

      var set = {}, info = {};
      for (var j = 0; j < rows.length; j++) {
        var x = rows[j];
        set[x.date] = true;
        if (!info[x.date]) info[x.date] = { title: "", rank: "" };
        if (!info[x.date].title && x.title) info[x.date].title = x.title;
        if (!info[x.date].rank && x.rank) info[x.date].rank = x.rank;
      }

      return { rows: rows, dates: Object.keys(set).sort(), info: info };
    }

    /* ==========================================================
       날짜 도우미 (MMdd 문자열)
       ========================================================== */
    function todayMMDD() {
      var parts = new Intl.DateTimeFormat("en-US", {
        timeZone: TIMEZONE, month: "2-digit", day: "2-digit"
      }).formatToParts(new Date());
      var m = "", d = "";
      for (var i = 0; i < parts.length; i++) {
        if (parts[i].type === "month") m = parts[i].value;
        if (parts[i].type === "day") d = parts[i].value;
      }
      return m + d;
    }

    function isValidMMDD(s) {
      if (!s || !/^\d{4}$/.test(s)) return false;
      var m = Number(s.substring(0, 2)), d = Number(s.substring(2, 4));
      return m >= 1 && m <= 12 && d >= 1 && d <= 31;
    }

    function formatMonthDay(mmdd) {
      return Number(mmdd.substring(0, 2)) + "월 " + Number(mmdd.substring(2, 4)) + "일";
    }

    // 오늘(포함) 이후 가장 가까운 고유미사. 올해 남은 게 없으면 목록의 첫 날짜(=내년 첫 고유미사)
    function getDefaultDate(today, dates) {
      if (dates.length === 0) return today;
      for (var i = 0; i < dates.length; i++) {
        if (dates[i] >= today) return dates[i];
      }
      return dates[0];
    }

    function getPrevDate(target, dates) {
      if (dates.length === 0) return null;
      for (var i = dates.length - 1; i >= 0; i--) {
        if (dates[i] < target) return dates[i];
      }
      return dates[dates.length - 1];
    }

    function getNextDate(target, dates) {
      if (dates.length === 0) return null;
      for (var i = 0; i < dates.length; i++) {
        if (dates[i] > target) return dates[i];
      }
      return dates[0];
    }

    function buildNavInfo(mmdd) {
      if (!mmdd) return null;
      var info = DATA.info[mmdd] || { title: "", rank: "" };
      var name = info.title;
      if (NAV_SHOW_RANK && info.rank) name += " " + info.rank;
      return { date: mmdd, label: formatMonthDay(mmdd), name: name };
    }

    /* ==========================================================
       고유미사 본문 만들기 (기존 Code.gs와 같은 규칙)
       ========================================================== */
    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function firstNonEmpty(rows, key) {
      for (var i = 0; i < rows.length; i++) {
        if (rows[i][key]) return rows[i][key];
      }
      return "";
    }

    function buildDisplayTitle(mmdd, rawTitle, rank) {
      var title = formatMonthDay(mmdd) + ": " + rawTitle;
      if (rank) title += "(" + rank + ")";
      return title;
    }

    function splitLines(text) {
      return String(text).split(/\n+/).map(function (l) { return l.trim(); })
        .filter(function (l) { return l.length > 0; });
    }

    // "제1독서(부활시기)", "화답송(부활시기)" 같은 접미사 항목을 원래 항목과 같게 취급
    function baseItemName(itemName) {
      return String(itemName || "").replace(/\s*[（(].*?[)）]\s*$/, "").trim();
    }

    function parseLiturgicalContent(itemName, text) {
      var baseName = baseItemName(itemName);
      var lines = splitLines(text);
      var subtitle = "";

      // 입당송 / 영성체송
      if (baseName === "입당송" || baseName === "영성체송") {
        var refMatch = lines.length > 0
          ? lines[0].match(/^([^\s]+ \d+[0-9a-zA-Z가-힣,.\-()]*\s*(?:참조)?)\s+(.*)/)
          : null;
        var refOnly = lines.length > 1 && /^[^\s]+ \d+[0-9a-zA-Z가-힣,.\-()]*(?:\s+참조)?\s*$/.test(lines[0]);
        if (refOnly) {
          subtitle = lines[0];
          lines.shift();
        } else if (refMatch) {
          subtitle = refMatch[1].trim();
          lines[0] = refMatch[2].trim();
        } else if (lines.length > 1 && lines[0].length < 35 && /[0-9]/.test(lines[0])) {
          subtitle = lines[0];
          lines.shift();
        }
      }

      // 제1독서 / 제2독서 / 복음 (부활시기 등 접미사 포함)
      else if (baseName === "제1독서" || baseName === "제2독서" || baseName === "복음") {
        var match = lines.length > 0 ? lines[0].match(/^[<〈](.*?)[>〉](.*)/) : null;
        if (match) {
          subtitle = "〈" + match[1].trim() + "〉";
          if (match[2].trim()) lines[0] = match[2].trim();
          else lines.shift();
        } else if (lines.length > 0 && /^[<〈].*[>〉]$/.test(lines[0])) {
          subtitle = lines[0];
          lines.shift();
        }
      }

      // 화답송 / 복음 환호송 (부활시기 등 접미사 포함)
      else if (baseName === "화답송" || baseName === "복음 환호송") {
        if (lines.length > 0 && lines[0].charAt(0) !== "◎" && lines[0].charAt(0) !== "○") {
          subtitle = lines[0];
          lines.shift();
        }
      }

      // 불필요한 숫자 제거
      lines = lines.map(function (l) { return l.replace(/(말씀입니다\.)\s*[0-9]+\s*$/, "$1"); });
      lines = lines.filter(function (l) { return !/^[0-9]+$/.test(l); });

      return { subtitle: subtitle, lines: lines };
    }

    function formatParagraphsForLiturgy(itemName, lines) {
      var html = "";
      var buffer = [];
      var baseName = baseItemName(itemName);
      var isVerseSection = (baseName === "화답송" || baseName === "복음 환호송" || baseName === "감사송");
      var isAntiphon = (itemName === "입당송" || itemName === "영성체송");
      var isFirstBlock = true;
      var nextBlockStyle = "";

      function flush() {
        if (buffer.length === 0) return;
        var cls = (isFirstBlock && isAntiphon) ? ' class="antiphon-body"' : "";
        var stl = nextBlockStyle ? ' style="' + nextBlockStyle + '"' : "";
        html += "<p" + cls + stl + ">" + buffer.map(escapeHtml).join("<br>") + "</p>";
        buffer = [];
        isFirstBlock = false;
        nextBlockStyle = "";
      }

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];

        var isRubricLike = (
          /예수회 공통|공통:|성인 고유:|감사송:/.test(line) ||
          (line.indexOf("감사송") > -1 && line.length < 40) ||
          (line.indexOf("공통") > -1 && line.length < 40) ||
          (line.indexOf("참조.") !== -1 && line.length < 40)
        );

        if (isRubricLike) {
          flush();
          nextBlockStyle = "";
          html += '<p class="rubric" style="margin-top: 1.8em;">' + escapeHtml(line) + "</p>";
          isFirstBlock = false;
          continue;
        }

        if (isVerseSection) {
          flush();
          html += '<p class="verse">' + escapeHtml(line) + "</p>";
          isFirstBlock = false;
          continue;
        }

        if (
          (line.indexOf("말씀입니다.") > -1 && line.indexOf("주님의 말씀입니다.") === -1) ||
          line.charAt(0) === "✠" ||
          line.charAt(0) === "▥"
        ) {
          flush();
          var mt = nextBlockStyle ? nextBlockStyle + " " : "";
          nextBlockStyle = "";
          html += '<p style="' + mt + 'margin-bottom:0.1em;">' + escapeHtml(line) + "</p>";
          isFirstBlock = false;
          continue;
        }

        if (line.indexOf("주님의 말씀입니다.") === 0) {
          flush();
          html += '<p class="reading-outro">' + escapeHtml(line) + "</p>";
          isFirstBlock = false;
          continue;
        }

        if (/비나이다\.$/.test(line) || /다름없나이다\.$/.test(line)) {
          buffer.push(line);
          flush();
          nextBlockStyle = "margin-top: 1.8em;";
          continue;
        }

        buffer.push(line);
      }

      flush();
      return html;
    }

    function getProprium(mmdd) {
      var rows = DATA.rows.filter(function (r) { return r.date === mmdd; });
      if (rows.length === 0) return null;

      var rawTitle = firstNonEmpty(rows, "title");
      var rank = firstNonEmpty(rows, "rank");
      var displayTitle = buildDisplayTitle(mmdd, rawTitle, rank);
      var html = "<h1>" + escapeHtml(displayTitle) + "</h1>";

      // 설명
      var descRow = null;
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].item === "설명") { descRow = rows[i]; break; }
      }
      if (descRow && descRow.content) {
        html += formatParagraphsForLiturgy("설명", splitLines(descRow.content));
      }

      // 전례 본문 (대영광송·신경처럼 내용이 비어도 행 자체가 "이 미사에 포함됨" 표시인 항목은 이름만 노출)
      rows.filter(function (r) {
        if (r.item === "설명") return false;
        if (r.content) return true;
        var base = baseItemName(r.item);
        return (base === "대영광송" || base === "신경");
      }).forEach(function (r) {
        if (!r.content) {
          html += "<p class='rubric'>" + escapeHtml(r.item) + "</p>";
          return;
        }
        var parsed = parseLiturgicalContent(r.item, r.content);
        var titleHtml = "<h2><span class='item-name'>" + escapeHtml(r.item) + "</span>";
        if (parsed.subtitle) {
          var subClass = (r.item === "입당송" || r.item === "영성체송") ? "subtitle-small" : "subtitle-normal";
          titleHtml += " <span class='" + subClass + "'>" + escapeHtml(parsed.subtitle) + "</span>";
        }
        titleHtml += "</h2>";
        html += titleHtml + "<hr class='item-divider'>" + formatParagraphsForLiturgy(r.item, parsed.lines);
      });

      return { title: displayTitle, body: html };
    }

    /* ==========================================================
       화면 그리기
       ========================================================== */
    var ORNAMENT_SRC = "img/frontispiece.png";

    function navCardHtml(info, dir) {
      var cls = "nav-card " + dir;
      var dirLabel = (dir === "prev") ? "← 이전" : "다음 →";
      if (!info) {
        return '<span class="' + cls + ' disabled"><span class="nav-dir">' + dirLabel +
               '</span><span class="nav-date">없음</span></span>';
      }
      return '<a class="' + cls + '" data-date="' + info.date + '" href="?date=' + info.date + '">' +
             '<span class="nav-dir">' + dirLabel + '</span>' +
             '<span class="nav-date">' + escapeHtml(info.label) + '</span>' +
             (info.name ? '<span class="nav-name">(' + escapeHtml(info.name) + ')</span>' : "") +
             "</a>";
    }

    function emptyStateHtml(date, prev, next) {
      var html = '<div class="empty-state ui-font"><div class="empty-symbol">✠</div>' +
        '<div class="empty-date">' + escapeHtml(formatMonthDay(date)) + "</div>" +
        '<div class="empty-message">이 날짜에는 예정된 예수회 고유미사가 없습니다.</div>' +
        '<div class="empty-links">';
      if (next) html += '<a class="empty-link" data-date="' + next.date + '" href="?date=' + next.date + '">다음 고유미사 →</a>';
      if (prev) html += '<a class="empty-link" data-date="' + prev.date + '" href="?date=' + prev.date + '">← 이전 고유미사</a>';
      html += '<a class="empty-link" data-view="list" href="?view=list">전체 목록 보기</a>';
      return html + "</div></div>";
    }

    /* 전체 목록: 달별로 묶어 한 해의 고유미사를 모두 보여 줍니다 */
    function listHtml() {
      var today = todayMMDD();
      var upcoming = getDefaultDate(today, DATA.dates);

      var html = '<div class="list-head">' +
        '<img class="ornament" src="' + ORNAMENT_SRC + '" alt="" width="1120" height="290" decoding="async">' +
        '<h1 class="list-title">예수회 고유미사</h1>' +
        '<div class="list-sub ui-font">모두 ' + DATA.dates.length +
        '일 · 날짜를 누르시면 그날의 고유미사가 펼쳐집니다</div>' +
        "</div>";

      var openMonth = false;
      for (var i = 0; i < DATA.dates.length; i++) {
        var date = DATA.dates[i];
        var month = Number(date.substring(0, 2));

        if (i === 0 || month !== Number(DATA.dates[i - 1].substring(0, 2))) {
          if (openMonth) html += "</div>";
          html += '<div class="month"><h2 class="month-name">' + month + "월</h2>";
          openMonth = true;
        }

        var info = DATA.info[date] || { title: "", rank: "" };
        var tag = "";
        if (date === today) tag = '<span class="tag ui-font">오늘</span>';
        else if (date === upcoming) tag = '<span class="tag ui-font">다가오는</span>';

        // 여러 성인을 함께 기념하는 날은 첫 축일명만 적고 나머지는 수로 알립니다.
        var parts = String(info.title).split(/\s*;\s*/).filter(function (p) { return p.length > 0; });
        var shortTitle = parts.length > 0 ? parts[0] : info.title;
        var more = (parts.length > 1)
          ? '<span class="entry-more ui-font">외 ' + (parts.length - 1) + "</span>"
          : "";

        html += '<a class="entry' + (date === today ? " is-today" : "") +
          '" data-date="' + date + '" href="?date=' + date + '" title="' + escapeHtml(info.title) + '">' +
          '<span class="entry-date ui-font">' + escapeHtml(formatMonthDay(date)) + "</span>" +
          '<span class="entry-title">' + escapeHtml(shortTitle) + more + tag + "</span>" +
          (info.rank ? '<span class="entry-rank ui-font">' + escapeHtml(info.rank) + "</span>" : "") +
          "</a>";
      }
      if (openMonth) html += "</div>";

      return html;
    }

    function setNotice(text) {
      var el = document.getElementById("notice");
      if (el) el.textContent = text || "";
    }

    function setToolbar(view) {
      var home = document.querySelector(".nav-button[data-home]");
      var list = document.querySelector('.nav-button[data-view="list"]');
      if (home) home.classList.toggle("home", view !== "list");
      if (list) list.classList.toggle("active", view === "list");
    }

    function stateToUrl(state, home) {
      if (home) return window.location.pathname;
      if (state.view === "list") return "?view=list";
      return "?date=" + state.date;
    }

    function render(state, opts) {
      opts = opts || {};
      currentState = state;

      var navHtml = "";
      var title = "예수회 고유미사";

      if (state.view === "list") {
        document.getElementById("book").innerHTML = listHtml();
        title = "전체 목록 — 예수회 고유미사";
      } else {
        var prevDate = getPrevDate(state.date, DATA.dates);
        var nextDate = getNextDate(state.date, DATA.dates);
        if (prevDate === state.date) prevDate = null; // 고유미사가 하나뿐인 경우
        if (nextDate === state.date) nextDate = null;
        var prev = buildNavInfo(prevDate);
        var next = buildNavInfo(nextDate);

        var proprium = getProprium(state.date);
        document.getElementById("book").innerHTML =
          proprium ? proprium.body : emptyStateHtml(state.date, prev, next);
        navHtml = navCardHtml(prev, "prev") + navCardHtml(next, "next");
        if (proprium) title = proprium.title;
      }

      document.getElementById("nav-top").innerHTML = navHtml;
      document.getElementById("nav-bottom").innerHTML = navHtml;
      document.title = title;
      setToolbar(state.view);

      if (opts.push) {
        try {
          window.history.pushState(state, "", stateToUrl(state, opts.home));
        } catch (e) {}
      }
      if (opts.scroll) window.scrollTo(0, 0);
    }

    function defaultState() {
      return { view: "day", date: getDefaultDate(todayMMDD(), DATA.dates) };
    }

    function initialState() {
      var params = null;
      try { params = new URLSearchParams(window.location.search); } catch (e) {}
      if (params && params.get("view") === "list") return { view: "list" };

      var q = params ? (params.get("date") || "") : "";
      return isValidMMDD(q) ? { view: "day", date: q } : defaultState();
    }

    /* ==========================================================
       이동 (새로고침 없이 바로 전환)
       ========================================================== */
    document.addEventListener("click", function (e) {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target.closest ? e.target.closest("a[data-date], a[data-home], a[data-view]") : null;
      if (!a || !DATA) return;

      e.preventDefault();
      if (a.hasAttribute("data-home")) {
        render(defaultState(), { push: true, home: true, scroll: true });
      } else if (a.hasAttribute("data-view")) {
        render({ view: a.getAttribute("data-view") }, { push: true, scroll: true });
      } else {
        render({ view: "day", date: a.getAttribute("data-date") }, { push: true, scroll: true });
      }
    });

    window.addEventListener("popstate", function () {
      if (DATA) render(initialState(), { scroll: true });
    });

    /* ==========================================================
       불러오기
       먼저 이 기기에 저장해 둔 내용을 보여 주고, 그동안 새 자료를 받아 옵니다.
       ========================================================== */
    function showStatus(html) {
      document.getElementById("book").innerHTML = '<div class="status ui-font">' + html + "</div>";
      document.getElementById("nav-top").innerHTML = "";
      document.getElementById("nav-bottom").innerHTML = "";
    }

    function showError(msg) {
      showStatus(msg + '<br><button type="button" class="retry" id="retry">다시 시도</button>');
      var b = document.getElementById("retry");
      if (b) b.addEventListener("click", function () { window.location.reload(); });
    }

    function readCache() {
      try { return window.localStorage.getItem(CACHE_KEY); } catch (e) { return null; }
    }
    function writeCache(text) {
      try { window.localStorage.setItem(CACHE_KEY, text); } catch (e) {}
    }

    function readAsCsv(res) {
      if (!res.ok) throw new Error("http " + res.status);
      return res.text().then(function (text) {
        if (/^\s*<(!doctype|html)/i.test(text)) throw new Error("not csv");
        return text;
      });
    }

    /* 사이트의 자료 주소를 먼저 쓰고, 안 되면 구글 시트를 직접 읽습니다 */
    function fetchCsv() {
      return fetch(DATA_URL, { cache: "no-store" })
        .then(readAsCsv)
        .catch(function (err) {
          if (typeof CSV_URL !== "string" || CSV_URL.indexOf("http") !== 0) throw err;
          return fetch(CSV_URL, { cache: "no-store" }).then(readAsCsv);
        });
    }

    function start(csvText, isRefresh) {
      var data = buildData(csvText);
      if (data.rows.length === 0) throw new Error("empty");
      DATA = data;
      render(isRefresh && currentState ? currentState : initialState(), {});
    }

    function load() {
      var cached = readCache();
      var showedCache = false;
      if (cached) {
        try { start(cached, false); showedCache = true; } catch (e) {}
      }

      fetchCsv()
        .then(function (text) {
          setNotice("");
          if (text === cached && showedCache) return;
          start(text, showedCache);
          writeCache(text);
        })
        .catch(function () {
          if (showedCache) {
            setNotice("자료를 새로 불러오지 못해, 이 기기에 저장해 둔 내용을 보여 드리고 있습니다.");
          } else {
            showError("내용을 불러오지 못했습니다.<br>인터넷 연결을 확인하고 다시 시도해 주세요.");
          }
        });
    }

    load();
  })();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
  </script>
</body>
</html>
